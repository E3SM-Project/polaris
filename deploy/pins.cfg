# pins for the pixi environment
[pixi]
bootstrap_python = 3.14
python = 3.14
geometric_features = 1.6.3
mache = 5.1.0
mpas_tools = 2.2.1
otps = 2021.10
parallelio = 2.6.9

# pins for the spack environment
[spack]
# Albany and Trilinos are only included with ./deploy.py --with-albany
albany = compass-2026-03-21
albany_variants = +mpas~py+unit_tests
# cmake 3.27.0 or newer is needed for Trilinos
albany_cmake = 3.27.0:
cmake = 3.23.0:
hdf5 = 1.14.6
parmetis = 4.0.3
scorpio = 2.0.3
trilinos = compass-2026-02-06
trilinos_variants =

# pins for both pixi and spack environments
[all]
esmf = 8.9.1
metis = 5.1.0
moab = 5.6.0
netcdf_c = 4.10.1
netcdf_fortran = 4.6.4
pnetcdf = 1.15.0
