[project]
name = "e3sm-polaris"
dynamic = ["version"]
authors = [
    { name="Xylar Asay-Davis", email="xylar@lanl.gov" },
    { name="Carolyn Begeman" },
    { name="Althea Denlinger" },
    { name="Steven Brus" },
    { name="Kat Smith" },
    { name="Darin Comeau" },
    { name="Alice Barthel" },
    { name="LeAnn Conlon" },
    { name="Joseph H Kennedy" },
]
description = "Testing and analysis for Omega, MPAS-Ocean, MALI and MPAS-Seaice"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    # these are only for searching/browsing projects on PyPI
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "cartopy>=0.26.0",
    "cfchecker",
    "cftime",
    "cmocean",
    "e3sm-mache>=5.1.0,<6.0.0",
    "geometric_features>=1.6.3,<2.0.0",
    "gsw",
    "jinja2",
    "lxml",
    "matplotlib>=3.9.0",
    "mosaic>=1.3.0,<2.0.0",
    "mpas_tools>=2.2.1,<3.0.0",
    "netcdf4",
    "numpy>=2.0,<3.0",
    "pandas",
    "pillow",
    "progressbar2",
    "pyproj",
    "pyremap>=2.5.0,<3.0.0",
    "pyshp",
    "requests",
    "ruamel.yaml",
    "scipy>=1.8.0",
    "shapely>=2.0.4,<3.0",
    "termcolor",
    "tranche>=0.6.1",
    "xarray",
]

[project.optional-dependencies]
# JIGSAW and JIGSAW-Python are not taken from conda-forge (its versions are
# too old) but built from source with `mache jigsaw install`.  Only the steps
# that build a JIGSAW mesh need them.
jigsaw = [
    "jigsawpy",
]

docs = [
    # building documentation
    "sphinx >=7.0.0",
    "sphinx_rtd_theme",
    "myst-parser",
    "sphinxcontrib-mermaid",
]

dev = [
    # linting and testing
    "flynt",
    "mypy",
    "pip",
    "pytest",
    "pre-commit",
    "ruff",
]

[tool.mypy]
# Deliberately no python_version: mypy applies it when parsing installed type
# stubs as well as our own code, so pinning it below the version those stubs
# are written for stops mypy before it checks anything.  Leaving it out makes
# mypy assume the interpreter it runs under, which is the one `deploy.py`
# installs.
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = ["docs*"]
line-length = 79

[tool.ruff.lint]
# E501 - max line-length
# E4 - whitespace
# E7 - multiple-statements
# E9 - trailing-whitespace
# F - Enable Pyflakes
# B - Enable flake8-bugbear
# W - Enable pycodestyle
# I - imports
# C901 - complex-structure
# D - Enable flake8-docstrings
select = ["E501", "E4", "E7", "E9", "F", "B", "W", "I", "C901"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 18.
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polaris", "polaris.*"]

# The data files installed with polaris.  A file of any other kind is left
# out of the package (``tests/test_package_data.py`` checks for this).
[tool.setuptools.package-data]
polaris = [
    "**/namelist.*",
    "**/streams.*",
    "**/README*",
    "**/*.cfg",
    "**/*.csv",
    "**/*.geojson",
    "**/*.json",
    "**/*.mplstyle",
    "**/*.rgb",
    "**/*.sh",
    "**/*.template",
    "**/*.txt",
    "**/*.yaml",
]

[tool.setuptools.dynamic]
version = { attr = "polaris.version.__version__" }

# evolution of options.entry-points
[project.scripts]
polaris = "polaris.__main__:main"
mpas_to_yaml = "polaris.yaml:main_mpas_to_yaml"

[project.urls]
Documentation = "https://docs.e3sm.org/polaris"
"Bug Tracker" = "https://github.com/E3SM-Project/polaris/issues"
