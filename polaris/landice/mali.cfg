# This config file has default config options for MALI

# The paths section points polaris to external paths
[paths]

# the relative or absolute path to the root of a branch where MALI has been
# built
component_path = ${paths:base_work_dir}/landice_build

# The namelists section defines paths to default namelists that will
# be used to generate specific namelists. By default, these point to the
# forward namelist in the default_inputs directory after a successful
# build of MALI.  Change these in a custom config file if you need a different
# location.
[namelists]
forward = ${paths:component_path}/default_inputs/namelist.landice

# The streams section defines paths to default streams files that will
# be used to generate specific streams files. By default, these point to the
# forward streams file in the default_inputs directory after a successful
# build of MALI. Change these in a custom config file if you need a different
# location.
[streams]
forward = ${paths:component_path}/default_inputs/streams.landice

# The registry section points to a post-processed registry file that can
# be used to identify the types (var, var_array, var_struct) of variables in
# a stream
[registry]
processed = ${paths:component_path}/src/Registry_processed.xml

# The executables section defines paths to required executables. These
# executables are provided for use by specific test cases.  Most tools that
# polaris needs should be in the deployment environment, so this is only the
# path to the MALI executable by default.
[executables]
component = ${paths:component_path}/landice_model


# Config options related to building components
[build]

# the branch to build from
branch = ${paths:polaris_branch}/e3sm_submodules/MALI-Dev

# whether to build MALI with Albany, which the first-order velocity solver
# needs: True, False or detect (with Albany if the environment provides it)
albany = detect
