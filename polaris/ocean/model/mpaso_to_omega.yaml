dimensions:
  Time: time
  nCells: NCells
  nEdges: NEdges
  nVertices: NVertices
  nTracers: NTracers
  maxEdges: MaxEdges
  maxEdges2: MaxEdges2
  TWO: MaxCellsOnEdge
  vertexDegree: VertexDegree
  nVertLevels: NVertLayers
  nVertLevelsP1: NVertLayersP1

variables:
  # mesh topology
  cellsOnCell: CellsOnCell
  edgesOnCell: EdgesOnCell
  verticesOnCell: VerticesOnCell
  cellsOnEdge: CellsOnEdge
  edgesOnEdge: EdgesOnEdge
  weightsOnEdge: WeightsOnEdge
  verticesOnEdge: VerticesOnEdge
  cellsOnVertex: CellsOnVertex
  edgesOnVertex: EdgesOnVertex

  # mesh coordinates
  xCell: XCell
  yCell: YCell
  zCell: ZCell
  latCell: LatCell
  lonCell: LonCell
  xEdge: XEdge
  yEdge: YEdge
  zEdge: ZEdge
  latEdge: LatEdge
  lonEdge: LonEdge
  xVertex: XVertex
  yVertex: YVertex
  zVertex: ZVertex
  latVertex: LatVertex
  lonVertex: LonVertex
  areaCell: AreaCell
  meshDensity: MeshDensity
  areaTriangle: AreaTriangle
  dvEdge: DvEdge
  dcEdge: DcEdge
  angleEdge: AngleEdge
  kiteAreasOnVertex: KiteAreasOnVertex
  weightsOnEdge: WeightsOnEdge

  # variables used for LSTSQ vector reconstruction
  reconstructStencilCell: ReconStencilCell
  reconstructStencilVertex: ReconStencilVertex
  nEdgesReconstructOnCell: NEdgesReconOnCell
  nEdgesReconstructOnVertex: NEdgesReconOnVertex
  reconstructWeightsCell: ReconWeightsCell
  reconstructWeightsVertex: ReconWeightsVertex

  # Coriolis
  fCell: FCell
  fEdge: FEdge
  fVertex: FVertex

  # vertical coordinate
  minLevelCell: MinLayerCell
  maxLevelCell: MaxLayerCell
  bottomDepth: BottomGeomDepth
  vertCoordMovementWeights: VertCoordMovementWeights
  # Note: restingThickness in MPAS-Ocean requires conversion to
  #       RefPseudoThickness in Omega (handled in write_vert_coord_dataset)

  # tracers
  temperature: Temperature
  salinity: Salinity
  tracer1: Debug1
  tracer2: Debug2
  tracer3: Debug3

  # state
  normalVelocity: NormalVelocity
  # Note: vertVelocityTop in MPAS-Ocean has no Omega equivalent and
  #       VerticalPseudoVelocity in Omega has no MPAS-Ocean equivalent
  # Note: Omega's SurfacePressure (relative/gauge) has no MPAS-Ocean
  #       equivalent; MPAS-Ocean's surfacePressure is an absolute pressure
  #       from the coupler, so the two are deliberately not mapped

  # auxiliary state
  ssh: SshCell
  relativeVorticity: RelVortVertex
  kineticEnergyCell: KineticEnergyCell

  # forcing
  windStressZonal: SfcStressZonal
  windStressMeridional: SfcStressMeridional
  snowFlux: snowFlux
  rainFlux: rainFlux
  evaporationFlux: evaporationFlux
  seaIceFreshWaterFlux: seaIceFreshWaterFlux
  iceRunoffFlux: iceRunoffFlux
  riverRunoffFlux: riverRunoffFlux
  latentHeatFlux: latentHeatFlux
  sensibleHeatFlux: sensibleHeatFlux
  longWaveHeatFluxUp: longWaveHeatFluxUp
  longWaveHeatFluxDown: longWaveHeatFluxDown
  seaIceHeatFlux: seaIceHeatFlux
  shortWaveHeatFlux: shortWaveHeatFlux
  seaIceSalinityFlux: seaIceSaltFlux

  # vertical coordinate diagnostics
  zMid: GeomZMid
  zInterface: GeomZInterface
  pressure: PressureMid

  # eos
  BruntVaisalaFreqTop: BruntVaisalaFreqSq

  # global stats daily variables
  normalVelocityMax: NormalVelocity_SpatialMax
  normalVelocityMin: NormalVelocity_SpatialMin
  normalVelocityAvg: NormalVelocity_SpatialMean
  normalVelocityRms: NormalVelocity_SpatialStdDev
  layerThicknessMax: PseudoThickness_SpatialMax
  layerThicknessMin: PseudoThickness_SpatialMin
  layerThicknessAvg: PseudoThickness_SpatialMean
  layerThicknessRms: PseudoThickness_SpatialStdDev
  temperatureMax: Temperature_SpatialMax
  temperatureMin: Temperature_SpatialMin
  temperatureAvg: Temperature_SpatialMean
  temperatureRms: Temperature_SpatialStdDev
  salinityMax: Salinity_SpatialMax
  salinityMin: Salinity_SpatialMin
  salinityAvg: Salinity_SpatialMean
  salinityRms: Salinity_SpatialStdDev

config:
- section:
    time_management: TimeIntegration
  options:
    config_start_time: StartTime
    config_stop_time: StopTime
    config_run_duration: RunDuration
    config_calendar_type: CalendarType

- section:
    time_integration: TimeIntegration
  options:
    config_time_integrator: TimeStepper
    config_dt: TimeStep

- section:
    time_integration: State
  options:
    config_number_of_time_levels: NTimeLevels

- section:
    decomposition: Decomp
  options:
    config_num_halos: HaloWidth

- section:
    io: IO
  options:
    config_pio_num_iotasks: IOTasks
    config_pio_stride: IOStride

- section:
    advection: Advection
  options:
    config_thickness_flux_type: FluxThicknessType

- section:
    advection: Advection
  options:
    config_horiz_tracer_adv_order: HorzTracerFluxOrder

- section:
    advection: Advection
  options:
    config_vert_tracer_adv_flux_order: VerticalTracerFluxOrder

- section:
    hmix_del2: Tendencies
  options:
    config_use_mom_del2: VelDiffTendencyEnable
    config_mom_del2: ViscDel2
    config_use_tracer_del2: TracerDiffTendencyEnable

- section:
    hmix_del4: Tendencies
  options:
    config_use_mom_del4: VelHyperDiffTendencyEnable
    config_mom_del4: ViscDel4
    config_use_tracer_del4: TracerHyperDiffTendencyEnable

- section:
    forcing: Tendencies
  options:
    config_use_bulk_wind_stress: SfcStressForcingTendencyEnable

- section:
    debug: [Tendencies, BottomDragTendency]
  options:
    config_disable_vel_explicit_bottom_drag: not Enable

- section:
    bottom_drag: [Tendencies, BottomDragTendency]
  options:
    config_bottom_drag_mode: Mode
    config_implicit_bottom_drag_type: Type
    config_explicit_bottom_drag_coeff: BottomDragCoeff
    config_implicit_constant_bottom_drag_coeff: BottomDragCoeff

- section:
    debug: Tendencies
  options:
    config_disable_tr_adv: not TracerHorzAdvTendencyEnable

- section:
    debug: Tendencies
  options:
    config_disable_vel_vadv: not VelocityVertAdvTendencyEnable

- section:
    debug: Tendencies
  options:
    config_disable_thick_hadv: not ThicknessFluxTendencyEnable

- section:
    debug: Tendencies
  options:
    config_disable_thick_vadv: not ThicknessVertAdvTendencyEnable

- section:
    debug: Tendencies
  options:
    config_disable_vel_pgrad: not PressureGradTendencyEnable

- section:
    debug: Tendencies
  options:
    config_disable_tr_sflux: not SfcTracerForcingTendencyEnable

- section:
    debug: Tendencies
  options:
    config_disable_thick_sflux: not SfcThicknessForcingTendencyEnable

- section:
    tracer_forcing_activeTracers: SurfaceRestoring
  options:
    config_salinity_restoring_constant_piston_velocity: PistonVelocity

- section:
    tracer_forcing_activeTracers: Tendencies
  options:
    config_use_activeTracers_surface_restoring: SurfaceTracerRestoringEnable

- section:
    bottom_drag: Tendencies
  options:
    config_explicit_bottom_drag_coeff: BottomDragCoeff

- section:
    debug: Tendencies
  options:
    config_disable_vel_vmix: not VelVertMixTendencyEnable
    config_disable_tr_vmix: not TracerVertMixTendencyEnable

- section:
    manufactured_solution: ManufacturedSolution
  options:
    config_manufactured_solution_wavelength_x: WavelengthX
    config_manufactured_solution_wavelength_y: WavelengthY
    config_manufactured_solution_amplitude: Amplitude

- section:
    eos: Eos
  options:
    config_eos_type: EosType

- section:
    eos_linear: [Eos, Linear]
  options:
    config_eos_linear_alpha: not DRhoDT
    config_eos_linear_beta: DRhoDS
    config_eos_linear_densityref: RhoT0S0

- section:
    ocean_constants: VertCoord
  options:
    config_density0: Density0

- section:
    cvmix: [VertMix, Background]
  options:
    config_cvmix_background_diffusion: Diffusivity
    config_cvmix_background_viscosity: Viscosity

- section:
    cvmix: [VertMix, Convective]
  options:
    config_use_cvmix_convection: Enable
    config_cvmix_convective_diffusion: Diffusivity
    config_cvmix_convective_triggerBVF: TriggerBVF

# Omega's shear mixing is the LMD94/KPP interior scheme, so only the
# MPAS-Ocean KPP shear options have Omega equivalents (there is no
# analog of the Pacanowski-Philander scheme or its PP_* options)
- section:
    cvmix: [VertMix, Shear]
  options:
    config_use_cvmix_shear: Enable
    # Omega implements only the LMD94 (CVMix "KPP") shear form, so the
    # Pacanowski-Philander options have no counterpart and
    # config_cvmix_shear_mixing_scheme must be set to KPP on the
    # MPAS-Ocean side
    config_cvmix_shear_KPP_nu_zero: BaseShearValue
    config_cvmix_shear_KPP_Ri_zero: RiCrit
    config_cvmix_shear_KPP_exp: Exponent
    config_cvmix_num_ri_smooth_loops: RiSmoothLoops
