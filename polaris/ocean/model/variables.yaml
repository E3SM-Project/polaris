ocean:
  horiz_mesh_variables:
    - indexToCellID
    - indexToEdgeID
    - indexToVertexID
    - cellsOnCell
    - nEdgesOnCell
    - edgesOnCell
    - verticesOnCell
    - cellsOnEdge
    - edgesOnEdge
    - nEdgesOnEdge
    - verticesOnEdge
    - cellsOnVertex
    - edgesOnVertex
    - xCell
    - yCell
    - zCell
    - latCell
    - lonCell
    - xEdge
    - yEdge
    - zEdge
    - latEdge
    - lonEdge
    - xVertex
    - yVertex
    - zVertex
    - latVertex
    - lonVertex
    - areaCell
    - meshDensity
    - areaTriangle
    - dvEdge
    - dcEdge
    - angleEdge
    - kiteAreasOnVertex
    - weightsOnEdge
    - fCell
    - fEdge
    - fVertex
  vert_coord_variables:
    - minLevelCell
    - maxLevelCell
    - bottomDepth
    - vertCoordMovementWeights
  state_variables:
    - temperature
    - salinity
    - normalVelocity

mpas-ocean:
  vert_coord_variables:
    - restingThickness
  state_variables:
    - layerThickness
# Fields defined at the top of each layer that a model nonetheless writes on
# ``nVertLevels``, leaving the bottom of the column off, rather than on
# ``nVertLevelsP1``.  MPAS-Ocean writes ``BruntVaisalaFreqTop`` this way.
# Dimensions cannot tell such a field from a layer average, so it is named
# here.  A field is only ever read from this list when it arrives on
# ``nVertLevels``. This is not an exhaustive list. Variables are added as they
# are used in Polaris.
  variables_at_layer_tops:
    - BruntVaisalaFreqTop


Omega:
  horiz_mesh_variables:
    # cell-centered vector-reconstruction fields; not used by MPAS-Ocean
    - ReconStencilCell
    - NEdgesReconOnCell
    - ReconWeightsCell
  vert_coord_variables:
    # [MinLayerCell, MaxLayerCell, BottomGeomDepth,
    # VertCoordMovementWeights, RefPseudoThickness]
    - RefPseudoThickness
  state_variables:
    - PseudoThickness
    # SurfacePressure is an Omega-only field (relative/gauge pressure) with no
    # MPAS-Ocean equivalent, so it is not in the mpaso_to_omega.yaml var map
    - SurfacePressure
