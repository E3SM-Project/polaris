[unified_mesh]
# name of this unified mesh; must match the config filename
mesh_name = u.oi.so12to30.lr10

# There is no plan to take this mesh into E3SM, so it has no assigned
# two-digit ID.  The XX placeholder is doing real work: it is not a
# valid ID, so files staged under it are self-evidently test artifacts
# and could not be mistaken for something belonging on the inputdata
# server.  It lets us run component_inputs end to end on the only
# regionally refined mesh we test.
e3sm_short_name = uXX.oi.so12to30.lr10

# Mesh family used to specialize shared unified-mesh behavior
mesh_family = so_region

# shared lat-lon target-grid resolution for coastline, river and sizing-field
# masks (degrees)
resolution_latlon = 0.0625

# Approximate total MPAS cell count, used to scale MPI task counts for
# preprocessing steps (e.g. WOA23 remapping).  Override in user config if
# the actual generated mesh differs significantly.
approximate_cell_count = 2000000

[river_network]
# inland clip distance used for base-mesh river products (km)
# Kept equal to coastline_transition_land_km so that river geometry begins
# exactly where the coastline blend ends; change the two together.
base_mesh_clip_distance_km = 90.0

# geometry simplification tolerance used for base-mesh river products (km)
base_mesh_simplify_tolerance_km = 5.0

# minimum retained segment length after base-mesh clipping (km)
base_mesh_min_segment_length_km = 5.0

[river_rasterize]
# physical buffer radius around river channels for the lat-lon channel mask;
# 0 preserves single-cell line rasterization
# We use twice the river resolution
channel_buffer_km = 20.0

[sizing_field]
# Whether to add a coastline refinement candidate field
enable_coastline_refinement = true

# Whether to add a river-channel refinement candidate field
enable_river_channel_refinement = true

# Minimum ocean background cell width (km). For constant backgrounds, set this
# equal to ocean_background_max_km.
ocean_background_min_km = 12.0

# Maximum ocean background cell width (km). For rrs_latitude, this is the
# equatorial resolution. For so_region, this is the coarse background.
ocean_background_max_km = 30.0

# Background land cell width (km)
land_background_km = 10.0

# Distance (km) over which the land side of the coastline refinement
# transitions back to the land background cell width.
#
# Wider than twice the ocean background, unlike u.oi6to18.lr6to10, because
# this mesh asks for a larger *relative* resolution jump at the coast:
# (30 - 10) / 30 = 0.67 against 0.44 there.  With the quadratic blend the
# mesh-size gradient one cell width inland is 2 |H - L| L / T^2, so at the
# T = 2 L this mesh used to have it equalled the linear ramp's and the
# shaped transition bought nothing at the scale jigsaw resolves -- the
# dcEdge CFL guard came out at 0.699 against u.oi6to18.lr6to10's 0.799.
# T = 90 km puts that gradient at 0.148, a third below the mesh that
# passes comfortably.  See the unified_mesh_dc_edge_noise design doc.
coastline_transition_land_km = 90.0

# Target cell width (km) along rasterized river channels
river_channel_km = 10.0
