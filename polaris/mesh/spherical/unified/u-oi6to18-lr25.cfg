[unified_mesh]
# name of this unified mesh; must match the config filename
mesh_name = u-oi6to18-lr25

# shared lat-lon target-grid resolution for coastline, river and sizing-field
# masks (degrees)
resolution_latlon = 0.03125

# Approximate total MPAS cell count, including the land and river-channel
# refinement, for sizing resources before the mesh exists.  Ocean steps use
# the smaller ocean-culled count where one is set.
approximate_cell_count = 4460000

[river_network]
# inland clip distance used for base-mesh river products (km)
# Kept equal to coastline_transition_land_km so that river geometry begins
# exactly where the coastline blend ends; change the two together.
base_mesh_clip_distance_km = 40.0

# geometry simplification tolerance used for base-mesh river products (km)
base_mesh_simplify_tolerance_km = 12.5

# minimum retained segment length after base-mesh clipping (km)
base_mesh_min_segment_length_km = 12.5

[sizing_field]
# Whether to add a coastline refinement candidate field
enable_coastline_refinement = true

# Whether to add a river-channel refinement candidate field.  This mesh does
# not refine river channels, but the retained river network still reaches
# JIGSAW as line constraints, so mesh edges follow the rivers.
enable_river_channel_refinement = false

# Background ocean resolution mode. Options are:
#   constant: one ocean cell width everywhere
#   rrs_latitude: RRS latitude-dependent ocean cell width
# Complex ocean backgrounds are delegated to mesh-family implementations.
ocean_background_mode = rrs_latitude

# Minimum ocean background cell width (km). For constant backgrounds, set this
# equal to ocean_background_max_km.
ocean_background_min_km = 6.0

# Maximum ocean background cell width (km). For rrs_latitude, this is the
# equatorial resolution. For so_region, this is the coarse background.
ocean_background_max_km = 18.0

# Background land cell width (km)
land_background_km = 25.0

# Distance (km) over which the land side of the coastline refinement
# transitions back to the land background cell width.
#
# Wider than about double the coarsest ocean cell size.  With the quadratic
# blend, the mesh-size gradient one cell width inland is 2 |H - L| L / T^2,
# which peaks where the ocean cells are half the land width, at mid-latitudes.
# At T = 36 km that peak would be 0.24, above the 0.22 that is known to pass
# the dcEdge CFL guard; 40 km brings it to 0.20.  See the
# unified_mesh_dc_edge_noise design doc.
coastline_transition_land_km = 40.0

# Target cell width (km) along rasterized river channels.  With the refinement
# off, this only sets how far apart retained river branches must be, so it is
# the land width.
river_channel_km = 25.0
