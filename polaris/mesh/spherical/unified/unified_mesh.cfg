[unified_mesh]
# Mesh family used to specialize shared unified-mesh behavior
mesh_family = default

# The E3SM short name of this mesh, assigned by the unified mesh team when a
# mesh reaches E3SM's master branch and the inputdata server.  The leading
# two-digit ID is the point: it distinguishes two meshes built to the same
# resolution recipe at different times, which a Polaris mesh name cannot.  A
# mesh with no assigned name leaves this blank, and staging component inputs
# for it fails rather than inventing one.
e3sm_short_name =


[spherical_mesh]
# the base mesh is mostly land, which gets culled away before the
# reconstruction weights would ever be used; skip computing them here and
# let the culling step compute weights on the much smaller culled mesh
generate_reconstruction_weights = False
