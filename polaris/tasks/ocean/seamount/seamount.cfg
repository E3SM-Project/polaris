# Options related to the vertical grid
[vertical_grid]

# Depth of the bottom of the ocean (m)
bottom_depth = 5000.0

# Number of vertical levels.  A multiple of 16, which Omega prefers, that
# divides the 5000 m bottom depth into exact 156.25 m layers and sits in the
# range the literature uses for this case (20 in Beckmann and Haidvogel,
# 20-30 in Shchepetkin and McWilliams).  It also keeps the z-star variant
# usable: at 10 levels the 500 m summit column would have a single level.
vert_levels = 32

# The type of vertical grid
grid_type = uniform

# Whether to use "partial" or "full", or "None" to not alter the topography
partial_cell_type = None

# The minimum fraction of a layer for partial cells
min_pc_fraction = 0.1

# config options for Coriolis
[coriolis]

# type of Coriolis: zero, constant, beta_plane, spherical, or rotated_sphere
type = constant

# the constant Coriolis parameter
constant_f = -1.0e-4


# Options related to the seamount case
[seamount]

# Timestep per km horizontal resolution (s), shared by both models.  RK4 is
# unsplit, so the step is limited by the barotropic gravity wave.  On the
# uniform hex mesh the C-grid divergence-gradient operator has a largest
# eigenvalue of 6 / dcEdge^2, so the fastest external mode is
# omega_max = sqrt(g * H) * sqrt(6) / dcEdge = 0.085 1/s for H = 5000 m and
# dcEdge = 6.4 km.  Against RK4's imaginary-axis limit of 2*sqrt(2) that
# caps dt near 33 s, or 5.2 s/km.  The cap in s/km is the same at any
# resolution, since the gravity wave frequency goes like 1 / dcEdge.  The
# value here is 77% of that cap, which leaves margin for the nonlinear
# terms, and none of the other constraints come close -- del4 viscosity
# allows 1100 s, del2 2e4 s, and advection 5e5 s.  In Omega, both 2.5 s/km and this value have been run for the full
# 6 days in both coordinate trees; sigma and z-star are stable at 4.0 s/km,
# with max |u| of 1.8 cm/s and 0.1 cm/s respectively.
dt_per_km = 4.0

# Barotropic timestep per km horizontal resolution (s), MPAS-Ocean only.  It
# is unused with RK4 and only takes effect if time_integrator is set back to
# a split-explicit scheme.
btr_dt_per_km = 2.5

# Time integrator, shared by both models.  Omega has no split time stepper
# yet, so MPAS-Ocean uses RK4 as well rather than its split-explicit
# integrator, which is what makes the two runs comparable.
time_integrator = RK4

# Horizontal tracer advection order, shared by both models
horiz_adv_order = 3

# Constant bottom drag coefficient.  Deliberately an order of magnitude
# below the 1e-2 that comparable idealized planar cases use.  The implicit
# drag damping timescale is h_bot / (Cd * |u|), and the bottom layer over
# the seamount summit is only ~16 m thick, so at 1e-2 a 5 cm/s spurious
# velocity damps in under half a day against a 6 day run.  That would cap a
# bad pressure gradient while leaving a good one untouched, compressing the
# dynamic range this test exists to measure.
bottom_drag_coeff = 1.0e-3

# The width of the domain in the across-slope dimension (km)
ly = 320

# The length of the domain in the along-slope dimension (km)
lx = 320

# Distance between two cell centers (km).  320 km divides into exactly 50
# cells at 6.4 km, so the domain really is lx by ly; at the 6.7 km this case
# used previously it was 321.6 km across, since the mesh is built from
# nx * resolution rather than from lx.  What the pressure gradient error
# actually responds to is the discrete steepness of the seamount,
# max |dh| / (h1 + h2) between adjacent cells, which is about
# 1.5 * resolution / seamount_width and so barely moves: 0.22 at 6.7 km,
# 0.21 at 6.4 km.
resolution = 6.4

# Bottom depth at bottom of seamount
max_bottom_depth = ${vertical_grid:bottom_depth}

# The stratification is set by the task tree, "exponential" or
# "linear_pressure", so seamount_stratification_type lives in
# seamount_exponential.cfg / seamount_linear_pressure.cfg rather than here.
# The parameters of every profile are shared and stay below; only the ones
# belonging to the configured profile are read.
#
# "linear" and "exponential" are the Beckmann and Haidvogel 1993 eqn 15-16
# density profiles, linear in geometric depth or an exponential of it.
# "linear_pressure" instead prescribes temperature linear in pressure, which
# is the profile a finite-volume horizontal pressure gradient reconstructs
# exactly.  Neither Beckmann and Haidvogel profile has that property: a
# density that is linear in depth is not linear in pressure, because specific
# volume varies down the column.  Measured on this configuration, temperature
# departs from a straight line in pressure by 8.5e-6 of its range under the
# linear equation of state and 6.9e-4 under TEOS-10 -- small, but ten orders
# of magnitude above the round-off an exactness argument needs.  "linear" is
# supported but no tree uses it.

# Density coefficient for linear vertical stratification (kg m^{-3})
seamount_density_coef_linear = 1024.0

# Density coefficient for exponential vertical stratification (kg m^{-3})
seamount_density_coef_exp = 1028.0

# Density gradient for linear vertical stratification, $\Delta_z \rho$ in Beckmann and Haidvogel eqn 15 (kg m^{-3})
seamount_density_gradient_linear = 0.1

# Density gradient for exponential vertical stratification, $\Delta_z \rho$ in Beckmann and Haidvogel eqn 16 (kg m^{-3})
seamount_density_gradient_exp = 3.0

# Density reference depth for linear vertical stratification (m)
seamount_density_depth_linear = 4500.0

# Density reference depth for exponential vertical stratification (m)
seamount_density_depth_exp = 500.0

# Temperature at zero pressure for the linear_pressure stratification, which
# prescribes T = coef - gradient * p / p_ref (degC).  The tracer is potential
# temperature for the linear equation of state and conservative temperature
# for TEOS-10; it is prescribed directly rather than inverted from a density,
# so the two equations of state span the same temperature range here but not
# the same density range.
seamount_temperature_coef_linear_pressure = 20.0

# Temperature change over seamount_pressure_ref_linear_pressure for the
# linear_pressure stratification (degC).  Chosen so that under the linear
# equation of state (alpha = 0.2) the profile spans 3.0 kg m^-3, the same
# density range as the exponential Beckmann and Haidvogel profile, so the two
# runs have the same total buoyancy range and a spurious velocity measured on
# one is comparable to the other.  The stratification is spread uniformly
# rather than concentrated in the upper 500 m, so the deep layers are more
# strongly stratified than in the exponential profile, not less.
seamount_temperature_gradient_linear_pressure = 15.0

# The pressure over which seamount_temperature_gradient_linear_pressure is
# spanned (dbar).  Close to the bottom pressure at the 5000 m sea floor, so
# the temperature at the deepest layer is near coef - gradient.
seamount_pressure_ref_linear_pressure = 5000.0

# Height of sea mount, $H_0$ (m)
seamount_height = 4500.0

# Width parameter of sea mount, e-folding length (m)
seamount_width = 40.0e3

# Salinity of the water in the entire domain, read as practical salinity
# (PSU) for the linear trees and as absolute salinity (g kg^-1) for the
# nonlinear ones
constant_salinity = 35.0

# A physical bottom-layer horizontal pressure-gradient acceleration (m s^-2)
# for the analysis step to report the spurious circulation as a fraction of.
# An absolute spurious velocity says nothing on its own; what gives it meaning
# is how it compares to a pressure gradient a realistic configuration actually
# carries in the layer where the problem shows up.  The default is the same
# reference the two-column pressure-gradient tests use.  The analysis step
# converts velocity to acceleration as |f| * max|u|, which is a
# balanced-state estimate: it is meaningful once the flow has adjusted and
# overstates the acceleration while it is still spinning up.
reference_bottom_pressure_grad = 2.1e-6

[seamount_default]

# Run duration (hours)
run_duration = 144.

# Output interval (hours)
output_interval = 1.

# Options for the short seamount task, a regression test rather than a
# measurement of the pressure gradient error
[seamount_short]

# Run duration (hours)
run_duration = 1.

# Output interval (hours).  Half the run duration, so the time series the viz
# step plots has more than a single point in it.
output_interval = 0.5
