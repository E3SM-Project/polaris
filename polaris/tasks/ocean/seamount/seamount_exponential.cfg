# Overrides for the seamount task trees that use the Beckmann and Haidvogel
# exponential stratification, their eqn 16.  This is the realistic profile
# and the reference configuration for the case: stratification concentrated
# in the upper 500 m over a nearly unstratified abyss.
#
# It is not in the exact set of a finite-volume horizontal pressure gradient
# -- an exponential of geometric depth is nowhere near a straight line in
# pressure -- so both pressure-gradient schemes carry a truncation error
# here.  That is the point: this is where the schemes are compared on a
# profile the ocean actually has.  See seamount_linear_pressure.cfg for the
# configuration where one of them is exact.

# Options related to the seamount case
[seamount]

# The vertical profile of the tracers
# possible_values="linear, exponential, linear_pressure"
seamount_stratification_type = exponential
