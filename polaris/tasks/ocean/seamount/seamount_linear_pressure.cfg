# Overrides for the seamount task trees whose stratification is linear in
# pressure.  A finite-volume horizontal pressure gradient reconstructs the
# tracers as polynomials in pressure and is exact when the continuous profile
# is linear in pressure, so its error vanishes on these trees and a spurious
# velocity that survives has some other source.  The centered scheme is not
# exact here, which is what makes it the control rather than a second null.
#
# Neither Beckmann and Haidvogel profile has that property, and their linear
# one -- a density linear in geometric depth -- is close enough to be
# mistaken for it: temperature departs from a straight line in pressure by
# 8.5e-6 of its range under the linear equation of state and 6.9e-4 under
# TEOS-10, against 7.3e-15 here.  See the "a stratification linear in
# pressure" section of the seamount page in the User's Guide.
#
# The profile parameters themselves live in the shared seamount.cfg; only the
# option that selects the profile belongs to this tree level.

# Options related to the seamount case
[seamount]

# The vertical profile of the tracers
# possible_values="linear, exponential, linear_pressure"
seamount_stratification_type = linear_pressure
