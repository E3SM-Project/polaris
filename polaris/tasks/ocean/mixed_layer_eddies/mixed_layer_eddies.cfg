# Options related to the vertical grid
[vertical_grid]

# the type of vertical grid
grid_type = uniform

# Number of vertical levels (a multiple of 16 for Omega performance)
vert_levels = 64

# Pseudo-depth of the bottom of the pseudo-height grid (m).  Pseudo-depth is
# not geometric depth (dz_geom = specvol * rho_sw * dz_tilde).  The column
# density is below rho_sw everywhere, so the pseudo-depth of the 152 m
# geometric bottom is slightly less than 152 m and all 64 levels are active,
# the bottom one slightly thinner than the others
bottom_depth = 152.0

# The type of vertical coordinate (e.g. z-level, z-star, p-star)
coord_type = p-star

# Whether to use "partial" or "full", or "None" to not alter the topography
partial_cell_type = None

# The minimum fraction of a layer for partial cells
min_pc_fraction = 0.1


# config options for the ocean component
[ocean]

# A salinity-only linear equation of state, rho = rho0 [1 + beta (S - S0)],
# with rho0 = 1027.5 kg m-3, beta = 1e-3 and S0 = 34 (Shrestha & Manucharyan
# 2022)

# Equation of state -drho/dT
eos_linear_alpha = 0.0

# Equation of state drho/dS: rho0 * beta
eos_linear_beta = 1.0275

# Equation of state constant term: rho0 - rho0 * beta * S0
eos_linear_rhoref = 992.565


# config options for Coriolis
[coriolis]

# type of Coriolis: zero, constant, beta_plane, spherical, or rotated_sphere
type = constant

# the constant Coriolis parameter (s-1)
constant_f = 1.4e-4


# config options for mixed-layer eddies tasks
[mixed_layer_eddies]

# the size of the doubly periodic domain in km in the x and y directions
lx = 300.0
ly = 200.0

# the geometric depth of the flat sea floor (m)
bottom_depth = 152.0

# the depth of the base of the mixed layer, H_m (m)
mixed_layer_depth = 30.0

# the width of the tanh taper at the base of the mixed layer, Delta h (m)
mixed_layer_taper_width = 5.0

# the amplitude of the sinusoidal density front, Delta rho_y (kg m-3)
front_density_difference = 3.0

# the density offset of the mixed layer, Delta rho_z (kg m-3)
mixed_layer_density_offset = 1.5

# the constant temperature (degC), which does not affect density
temperature = -1.4

# the amplitude of the uniform salinity noise that seeds the instability
salinity_noise_amplitude = 0.01

# the seed for the salinity noise, so the initial state is reproducible
noise_seed = 1


# config options for forward runs of mixed-layer eddies tasks
[mixed_layer_eddies_forward]

# Time integration scheme
time_integrator = split_explicit

# time step per resolution (s/km), since dt is proportional to resolution
dt_per_km = 120.0

# barotropic time step per resolution (s/km)
btr_dt_per_km = 4.0

# Laplacian viscosity per resolution (m2 s-1 per km), scaling with dx
del2_viscosity_per_km = 1.0

# biharmonic viscosity per resolution cubed (m4 s-1 per km3), scaling with
# dx^3
del4_viscosity_per_km3 = 4.4e6

# the duration of each run (days)
run_duration = 15.0

# the duration of the resolved run's spin-up before the eddy diagnosis
# window (days)
spinup_duration = 5.0

# the duration of the eddy diagnosis window (days)
eddy_window_duration = 2.0

# the interval between snapshots for the eddy diagnostics (hours)
eddy_output_interval = 3.0


# the submesoscale eddy parameterization, when on, with E3SM's coupled
# defaults (namelist_defaults_mpaso.xml), which are also Omega's defaults
[mixed_layer_eddies_mle]

# the time scale that keeps the closure finite near the equator (s)
tau = 172800.0

# the efficiency coefficient
ce = 0.08

# the minimum frontal width (m)
lf_min = 1000.0

# the maximum grid length used in the rescaling (m)
ds_max = 100000.0


# config options for the analysis of mixed-layer eddies tasks
[mixed_layer_eddies_analysis]

# the half-width of the frontal zone around y = L_y / 2, as a fraction of
# L_y (Shrestha & Manucharyan's 75-125 km of 200 km)
frontal_zone_fraction = 0.125

# the salinity classes for the eddy overturning
salinity_bin_min = 24.0
salinity_bin_max = 34.0
salinity_bin_width = 0.1

# the efficiency coefficient in the Fox-Kemper et al. (2008) scaling that
# normalizes the eddy overturning
ce = 0.08

# the range of |Psi+| at mid-mixed-layer in the resolved run that passes
psi_plus_min = 0.5
psi_plus_max = 2.0

# the largest normalized RMSE (RMSE divided by the formula's RMS) that passes
# at each resolution, on edges with a consistent mixed-layer depth.  Limits
# allow modest headroom over the reported Omega baselines of 5.2% and 2.9%;
# MPAS-Ocean baselines are 1.3% and 0.7%, respectively
verify_tolerance_8km = 0.06
verify_tolerance_16km = 0.035

# the smallest fraction of frontal-zone edges with such a consistent
# mixed-layer depth that passes
verify_min_consistent_fraction = 0.5

# the day of the coarse runs' output that is verified.  While the mixed
# layer is restratifying, Omega's output mixed-layer depth often differs from
# the one its eddy velocity used; by the end of the run, it rarely does
verify_day = 15

# the duration of the Rossby adjustment (days), after which potential-energy
# release is compared
adjustment_days = 2.0
