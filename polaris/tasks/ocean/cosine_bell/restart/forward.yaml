ocean:
  time_management:
    config_start_time: {{ start_time }}
    config_stop_time: none
    config_run_duration: {{ run_duration }}

mpas-ocean:
  time_management:
    config_do_restart: {{ do_restart }}
  io:
    config_write_output_on_startup: false
  streams:
    restart:
      filename_template: ../restarts/rst.$Y-$M-$D_$h.$m.$s.nc
      filename_interval: output_interval
      output_interval: 0000-00-00_00:00:01
    output:
      output_interval: {{ output_interval }}

Omega:
  TimeIntegration:
    # Whether a restart is read is decided here rather than by keeping
    # RestartRead out of the way with a start time it never reaches, which is
    # what Omega's UseStartEnd sentinel used to be for.
    StartType: {{ start_type }}
  IOStreams:
    InitialState:
      FreqUnits: {{ init_freq_units }}
    RestartRead:
      UsePointerFile: false
      UseStartEnd: false
      Filename: ../restarts/rst.$Y-$M-$D_$h.$m.$s
    RestartWrite:
      UsePointerFile: false
      Filename: ../restarts/rst.$Y-$M-$D_$h.$m.$s
      Freq: 1
      FreqUnits: seconds
    History:
      Freq: {{ output_freq }}
      FreqUnits: seconds
