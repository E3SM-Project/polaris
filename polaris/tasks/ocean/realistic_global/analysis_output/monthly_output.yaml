Omega:
  Analysis:
    GlobalStats:
      # Omega's default list plus the two remaining fields the ocean analysis
      # plots time series of.  Both KineticEnergyCell (2D) and SshCell (1D)
      # have spatial operators registered for their rank.  The period and file
      # name come from the forward step's own yaml.
      Fields: [NormalVelocity, PseudoThickness, Temperature, Salinity,
               KineticEnergyCell, SshCell]
    MonthlyAverages:
      Enable: true
      # The fields the ocean analysis reads: the plotted fields, and what is
      # needed to turn pseudo-thickness into geometric thickness and layer
      # elevations offline.  Omega has no cell-centered reconstructed
      # velocity yet, so the edge-normal velocity is written instead.
      Fields: [Temperature, Salinity, PseudoThickness, SpecVol, GeomZMid,
               GeomZInterface, SshCell, NormalVelocity, KineticEnergyCell]
      ReductionPeriod: [1Month]
      # Omega inserts "_1MonthTimeStats" before the timestamp template, so
      # the files are monthly_means_1MonthTimeStats.$Y-$M.nc; the ".nc"
      # suffix is part of the template.  Each is named for the month after
      # the one it averages (E3SM-Project/Omega#554).
      Filename: monthly_means.$Y-$M.nc
      Stream:
        FileFreq: 1
        FileFreqUnits: months
    MOC:
      Enable: true
      # Set per mesh: a bin with no cells in it adds nothing to the running
      # sum, so bins finer than the mesh make the streamfunction a staircase
      # in latitude.
      NumBins: {{ moc_num_bins }}
      MinLat: -90.0
      MaxLat: 90.0
      # Region masks are not implemented in Omega yet, and the ocean analysis
      # plots only the global streamfunction
      Regions: [Global]
      Transects: []
      # Monthly means, so that the analysis averages the same months it
      # makes the climatology from.  Omega multiplies the streamfunction by
      # 1e-6, so the output is in Sv, and attaches the latitude bin
      # boundaries and the horizontally averaged interface elevation to the
      # stream as the two axes.
      ReductionPeriod: [1Month]
      SnapshotPeriod: []
      # the files are moc_1MonthTimeStats.$Y-$M.nc, as for the monthly means
      Filename: moc.$Y-$M.nc
      Stream:
        FileFreq: 1
        FileFreqUnits: months
  IOStreams:
    History:
      # Monthly snapshots of the same fields as the monthly means, taken at
      # the instant each mean is finalized, as a check on the means.  Omega
      # does not append the ".nc" suffix itself, so it is part of the
      # template, and it does not create the directory; the step does.
      Filename: output/ocn.hist.$Y-$M.nc
      Freq: 1
      FreqUnits: months
      # One time record per file.  The forward step's FileFreq of 9999 years
      # would put every month in one file, since a stream's options merge.
      FileFreq: 1
      FileFreqUnits: months
      IfExists: replace
      Contents:
        - Tracers
        - PseudoThickness
        - SpecVol
        - GeomZMid
        - GeomZInterface
        - SshCell
        - NormalVelocity
        - KineticEnergyCell
    RestartWrite:
      # Monthly, so that the year can be continued from any month.  Omega
      # checkpoints the partial sums of the monthly means, so a restart in
      # the middle of a month would work as well (E3SM-Project/Omega#611).
      # The run is a whole number of months, so the last restart still lands
      # on the last time step.
      Freq: 1
      FreqUnits: months
