# Options for the forward run on the cached EC30to60E2r2 initial condition.
#
# There is no [vertical_grid] section here: this mesh is not built by Polaris,
# and the vertical grid arrives with the cached initial condition.
[realistic_global_forward]

# The split time steps of the one-year Omega runs on this mesh
dt = 00:30:00
btr_dt = 00:01:00

# The time step of the rk4 variant, tuned for RK4 on this mesh, whose measured
# minimum dcEdge is about 22.5 km rather than the 30 km its name suggests
rk4_dt = 00:00:45

# The harmonic momentum viscosity (m^2/s).  The default of 1.0e3 leaves
# grid-scale noise in the velocity in the 60-km mid-latitude cells, and a
# striped deep overturning streamfunction.  1.0e4 removes much of both, at the
# cost of weaker resolved currents.  The biharmonic viscosity stays at its
# default: Omega does not scale it with cell width
# (https://github.com/E3SM-Project/Omega/issues/476), and 5.0e11 is unstable
# with a 30-minute time step in the 30-km cells, so it cannot be raised enough
# to damp the 60-km ones.  Chosen before Omega had KPP, and provisional until
# Omega scales its viscosity and has the fix to its pressure-gradient errors
# over bathymetry.
mom_del2 = 1.0e4

# a day is already 236853 cells at a 45 s RK4 step, so this is as long as it
# can reasonably be
run_duration = 0001_00:00:00

# These tasks exist to compare MPAS-Ocean with Omega on one mesh and one
# initial condition, so everything MPAS-Ocean has that Omega does not is turned
# off: it would only make the two runs less comparable.  That is the opposite
# of the init-chain tasks on the unified meshes, which are testing those meshes
# in E3SM and so want E3SM's physics.
#
# Expect this list to shrink as Omega gains capabilities; it describes what
# Omega lacks today, not a considered choice of physics.
use_GM = False
use_Redi = False
use_submesoscale = False

# blank leaves the MPAS-Ocean default of pressure_and_zmid, the ordinary
# counterpart to Omega's Centered.  Jacobian_from_TS has no Omega equivalent.
pressure_gradient_type =
