# Options for the forward run on E3SM's EC30to60E2r2 mesh, from its cached
# initial condition.
#
# There is no [vertical_grid] section here: this mesh is not built by Polaris,
# and the vertical grid arrives with the cached initial condition.
[realistic_global_forward]

# The split time steps of the one-year Omega runs on this mesh
dt = 00:30:00
btr_dt = 00:01:00

# The time step of the rk4 variant, tuned for RK4 on this mesh, whose measured
# minimum dcEdge is about 22.5 km rather than the 30 km its name suggests
rk4_dt = 00:00:45

# The momentum viscosities, scaled from this mesh's median cell width of about
# 36 km.  The biharmonic one is E3SM's 1.2e11 at 30 km rescaled to that
# median.  E3SM's harmonic one, 1.0e3 at 30 km, checkerboards the divergence
# along the Gulf Stream and the coasts of the Maritime Continent in one-year
# Omega runs, so the harmonic viscosity stays at 1.0e4, which also damps the
# grid-scale noise and striped deep overturning seen in the 60-km cells.
# Provisional until Omega has the fix to its pressure-gradient errors over
# bathymetry.
mom_del2 = 1.0e4
mom_del4 = 2.06e11

# a day is already 236853 cells at a 45 s RK4 step, so this is as long as it
# can reasonably be
run_duration = 0001_00:00:00
