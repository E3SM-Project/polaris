# Ocean-specific properties of this mesh
[realistic_global_mesh]

# Approximate cell count of the ocean + sea-ice culled mesh that the ocean
# model actually runs, used to size ocean MPI task counts (ntasks/min_tasks).
# This excludes the finer land and river-channel refinement, which is culled
# away before the ocean model runs.
culled_ocean_cell_count = 4000000


# Options for the forward run on this mesh, ported from the Compass rrs6to18
# mesh
[realistic_global_forward]

# the mesh resolves eddies, so no eddy parameterization and no harmonic
# viscosity, and a much smaller biharmonic viscosity than the default
mom_del2 =

# E3SM's value for RRSwISC6to18E3r5, which is this mesh's closest analog, and
# is referenced there to that mesh's finest cells.  Cubic scaling from a 6 km
# reference therefore reproduces E3SM's viscosity as a function of cell width
# to within about 15% across the whole mesh.
mom_del4 = 3.2e09
hmix_scaling = ref_cell_width
hmix_ref_cell_width = 6.0e3

# damp the divergent grid-scale mode ten times harder than the rotational one,
# matching RRSwISC6to18E3r5, the only E3SM mesh that sets this.  At 6 km the
# rotational part is resolved eddies worth keeping sharp; the divergent part is
# where C-grid grid-scale noise lives.
mom_del4_div_factor = 10.0

use_GM = False
use_Redi = False
