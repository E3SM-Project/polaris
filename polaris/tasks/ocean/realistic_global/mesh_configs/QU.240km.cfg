# Options for the forward run on the cached QU.240km initial condition.
#
# There is no [vertical_grid] section here: this mesh is not built by Polaris,
# and the vertical grid arrives with the cached initial condition.
[realistic_global_forward]

# RK4 for MPAS-Ocean as well as Omega, rather than the split_explicit_ab2
# default.  Both models then advance the same way, which is the point of a task
# whose whole purpose is to compare them on one mesh and one initial condition,
# and it is what the time step below was tuned for.
mpaso_time_integrator = RK4

# tuned for RK4 on this mesh; the actual minimum dcEdge is well below the
# nominal 240 km, so this is not the default per-km scaling
dt = 00:10:00

# long enough to see the statistics move, short enough to stay cheap on 7153
# cells
run_duration = 0005_00:00:00

# These tasks exist to compare MPAS-Ocean with Omega on one mesh and one
# initial condition, so everything MPAS-Ocean has that Omega does not is turned
# off: it would only make the two runs less comparable.  That is the opposite
# of the init-chain tasks on the unified meshes, which are testing those meshes
# in E3SM and so want E3SM's physics.
#
# Expect this list to shrink as Omega gains capabilities; it describes what
# Omega lacks today, not a considered choice of physics.
use_GM = False
use_Redi = False
use_KPP = False
use_submesoscale = False

# blank leaves the MPAS-Ocean default of pressure_and_zmid, the ordinary
# counterpart to Omega's Centered.  Jacobian_from_TS has no Omega equivalent.
pressure_gradient_type =
