# Ocean-specific properties of this mesh
[realistic_global_mesh]

# Approximate cell count of the ocean + sea-ice culled mesh that the ocean
# model actually runs, used to size ocean MPI task counts (ntasks/min_tasks).
# For the constant 30 km ocean background this is roughly the ocean fraction of
# the globe: ~0.71 * 6e8 / 30**2 ~= 470000.
culled_ocean_cell_count = 470000


# Options for the forward run on this mesh, ported from the Compass qu mesh
[realistic_global_forward]

# the shared default coefficients, as in Compass, where they apply at this
# mesh's 30 km cells
hmix_ref_cell_width = 30.0e3
