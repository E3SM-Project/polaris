# Ocean-specific properties of this mesh
[realistic_global_mesh]

# Approximate cell count of the ocean + sea-ice culled mesh that the ocean
# model actually runs, used to size ocean MPI task counts (ntasks/min_tasks).
# This excludes the finer land and river-channel refinement, which is culled
# away before the ocean model runs.
culled_ocean_cell_count = 800000


# Options for the forward run on this mesh, ported from the Compass so12to30
# mesh.  Its time step is deliberately not ported: it is far more conservative
# than the resolution alone justifies, almost certainly because the Compass
# mesh has ice-shelf cavities.  Revisit if this mesh becomes more than a proof
# of concept for regional refinement.
[realistic_global_forward]

# resolution-dependent viscosities, scaled with the mesh, and a constant GM
# closure
mom_del2 = 462.0
mom_del4 = 1.18e10
hmix_scaling = scale_with_mesh
GM_closure = constant
GM_constant_kappa = 600.0
