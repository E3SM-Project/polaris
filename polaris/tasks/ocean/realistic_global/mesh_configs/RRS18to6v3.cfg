# Options for realistic_global analysis output on the cached RRS18to6v3 mesh
[realistic_global_forward]

# The 10-second step used by the RRS test
dt = 00:00:10

# Disable harmonic momentum viscosity; retain the MPAS-default biharmonic
# value for this mesh, with no extra damping of its divergent component.
mom_del2 =
mom_del4 = 3.2e09
mom_del4_div_factor = 1.0
hmix_ref_cell_width = 6.0e3

# Keep tracer del2 at zero and disable biharmonic tracer diffusion.
tracer_del2 = 0.0
tracer_del4 = 0.0

# The RRS mesh resolves eddies.
use_GM = False
use_Redi = False
