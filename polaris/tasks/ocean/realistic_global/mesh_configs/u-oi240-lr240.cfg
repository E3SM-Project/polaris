# Ocean-specific properties of this mesh
[realistic_global_mesh]

# Approximate cell count of the ocean + sea-ice culled mesh that the ocean
# model actually runs, used to size ocean MPI task counts (ntasks/min_tasks).
# For the constant 240 km ocean background this is roughly the ocean fraction
# of the globe: ~0.71 * 6e8 / 240**2 ~= 7500.
culled_ocean_cell_count = 7500


# Options related to the vertical grid
[vertical_grid]

# the type of vertical grid
grid_type = tanh_dz

# Number of vertical levels
vert_levels = 16

# Depth of the bottom of the ocean
bottom_depth = 3000.0

# The minimum layer thickness
min_layer_thickness = 3.0

# The maximum layer thickness
max_layer_thickness = 500.0


# Options for the forward run on this mesh, following E3SM's oQU240 mesh
[realistic_global_forward]

# E3SM's split time steps for oQU240.  The default of 30 s/km would give 2
# hours, which grew a surface hotspot along the Aleutians in a one-year Omega
# run on the cached e3sm-qu240 mesh.
dt = 01:00:00
btr_dt = 00:03:00

# E3SM's horizontal mixing for oQU240: a biharmonic momentum viscosity alone,
# with no harmonic viscosity and no tracer diffusion.  E3SM applies it
# unscaled, and scaling from this mesh's 240 km finest cells stays near 1.
mom_del2 =
mom_del4 = 2.0e14
hmix_ref_cell_width = 240.0e3


# Options for the one-year analysis_output run on this mesh
[analysis_output]

# The number of latitude bins of the overturning streamfunction: three
# degrees, since Omega's default of one degree is finer than the mesh
moc_num_bins = 60
