# Ocean-specific properties of this mesh
[realistic_global_mesh]

# Approximate cell count of the ocean + sea-ice culled mesh that the ocean
# model actually runs, used to size ocean MPI task counts (ntasks/min_tasks).
# For the constant 240 km ocean background this is roughly the ocean fraction
# of the globe: ~0.71 * 6e8 / 240**2 ~= 7500.
culled_ocean_cell_count = 7500


# Options related to the vertical grid
[vertical_grid]

# the type of vertical grid
grid_type = tanh_dz

# Number of vertical levels
vert_levels = 16

# Depth of the bottom of the ocean
bottom_depth = 3000.0

# The minimum layer thickness
min_layer_thickness = 3.0

# The maximum layer thickness
max_layer_thickness = 500.0


# Options for the forward run on this mesh, ported from the Compass qu240 mesh
[realistic_global_forward]

# tracer mixing, scaled relative to a reference cell width.  The reference is
# this mesh's own width, so the coefficients above are used as given; leaving
# it at the 30 km default would scale them by 240/30.
tracer_del2 = 10.0
tracer_del4 = 1.2e11
hmix_scaling = ref_cell_width
hmix_ref_cell_width = 240.0e3

# Stated rather than left at the default, because the Compass configuration
# these options were ported from turned both on for its qu240 mesh and this is
# a deliberate departure from it.  There they were a smoke-test convenience;
# that purpose does not apply here, at least not yet.  With Leith off, the
# constant mom_del2 above is the harmonic viscosity.
use_Leith_del2 = False
use_frazil_ice_formation = False
