# Options for adjusting the SSH under land ice to the land-ice pressure, which
# every realistic global ocean run with ice-shelf cavities starts from.  Each
# iteration is a single short step from rest with the land-ice pressure and no
# land-ice fluxes, after which the SSH under land ice changes by the amount
# that cancels the depth-mean acceleration of that step.  The land-ice
# pressure is left unchanged.  The step otherwise takes the
# [realistic_global_forward] options, including its time integrator.
[ssh_adjustment]

# How to make SSH consistent with the land-ice pressure.  Only "solve" is
# supported for realistic global runs.
method = solve

# The number of iterations of SSH adjustment
iterations = 2

# The time step in seconds, as a function of the mesh's minimum resolution
# in km, of the single step from rest
solve_dt_per_km = 1.0

# Adjust the SSH rather than the land-ice pressure
adjust_variable = ssh

# The variable in the initial state that marks where to adjust SSH
mask_variable = sshAdjustmentMask
