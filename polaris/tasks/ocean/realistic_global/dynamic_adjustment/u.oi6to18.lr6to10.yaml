# Dynamic-adjustment schedule for the u.oi6to18.lr6to10 unified mesh
# (6-18 km).  Ported from Compass' rrs6to18 schedule.  The restart interval
# varies by stage, so it is set per stage rather than shared.
dynamic_adjustment:
  shared:
    time_integrator: split_explicit_ab2
    output_interval: 10_00:00:00
    start_time: 0001-01-01_00:00:00
  stages:
    damped_adjustment_1:
      run_duration: 00_06:00:00
      restart_interval: 00_06:00:00
      dt: 00:00:30
      btr_dt: 00:00:01
      damping: 1.0e-3
    damped_adjustment_2:
      run_duration: 00_06:00:00
      restart_interval: 00_06:00:00
      dt: 00:01:00
      btr_dt: 00:00:02
      damping: 4.0e-4
    damped_adjustment_3:
      run_duration: 00_12:00:00
      restart_interval: 00_12:00:00
      dt: 00:02:00
      btr_dt: 00:00:04
      damping: 1.0e-4
    damped_adjustment_4:
      run_duration: 01_00:00:00
      restart_interval: 01_00:00:00
      dt: 00:03:00
      btr_dt: 00:00:06
      damping: 4.0e-5
    damped_adjustment_5:
      run_duration: 01_00:00:00
      restart_interval: 01_00:00:00
      dt: 00:04:00
      btr_dt: 00:00:08
      damping: 2.0e-5
    damped_adjustment_6:
      run_duration: 03_00:00:00
      restart_interval: 03_00:00:00
      dt: 00:04:00
      btr_dt: 00:00:08
      damping: 5.0e-6
    damped_adjustment_7:
      run_duration: 06_00:00:00
      restart_interval: 06_00:00:00
      dt: 00:05:00
      btr_dt: 00:00:10
      damping: 5.0e-6
    simulation:
      run_duration: 18_00:00:00
      restart_interval: 06_00:00:00
      dt: 00:05:00
      btr_dt: 00:00:10
      # damping omitted => no Rayleigh damping
