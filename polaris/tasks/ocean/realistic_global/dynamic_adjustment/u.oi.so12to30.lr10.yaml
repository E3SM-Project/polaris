# Dynamic-adjustment schedule for the u.oi.so12to30.lr10 unified mesh
# (Southern Ocean 12-30 km).  Ported from Compass' so12to30 schedule.  The
# restart interval varies by stage, so it is set per stage rather than shared.
dynamic_adjustment:
  shared:
    time_integrator: split_explicit_ab2
    output_interval: 10_00:00:00
    start_time: 0001-01-01_00:00:00
  stages:
    damped_adjustment_1:
      run_duration: 02_00:00:00
      restart_interval: 02_00:00:00
      dt: 00:05:00
      btr_dt: 00:00:10
      damping: 1.0e-4
    damped_adjustment_2:
      run_duration: 08_00:00:00
      restart_interval: 02_00:00:00
      dt: 00:05:00
      btr_dt: 00:00:10
      damping: 1.0e-5
    damped_adjustment_3:
      run_duration: 10_00:00:00
      restart_interval: 10_00:00:00
      dt: 00:05:00
      btr_dt: 00:00:10
      damping: 1.0e-6
    damped_adjustment_4:
      run_duration: 20_00:00:00
      restart_interval: 10_00:00:00
      dt: 00:05:00
      btr_dt: 00:00:10
      # damping omitted => no Rayleigh damping
    simulation:
      run_duration: 10_00:00:00
      restart_interval: 10_00:00:00
      dt: 00:10:00
      btr_dt: 00:00:15
      # damping omitted => no Rayleigh damping
