# Options related to building the shortwave extinction coefficient product
# from the GMIS chlorophyll-a climatology
[gmis_extinction]

# the directory the monthly GMIS files are downloaded from
base_url = https://jeodpp.jrc.ec.europa.eu/ftp/public/JRC-OpenData/GMIS/satellite/9km/climatology

# the sensor to use: A for MODIS-Aqua or V for VIIRS
sensor = A

# monthly chlorophyll (mg m^-3) is capped at this value so that lake and
# estuary values do not dominate coastal cells after remapping
max_chl = 10.0

# chlorophyll (mg m^-3) for points with no valid month (perennial sea ice,
# polar night and land), and the coefficients that follow from it.  A
# constant is used rather than extrapolation so that values from lakes,
# estuaries and ice-edge blooms are not spread into regions never observed.
fill_chl = 0.1
