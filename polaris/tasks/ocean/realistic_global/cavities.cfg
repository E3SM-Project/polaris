# Options for a realistic global ocean with ice-shelf cavities, which are
# ignored without them
[realistic_global_cavities]

# The density (kg m-3) of land ice, from which its pressure on the ocean
# follows from its ice-equivalent thickness.  This is MALI's ice density, so
# the load matches the ice geometry MALI would supply.
land_ice_density = 910.0

# The ocean density (kg m-3) that converts between the land-ice pressure and
# the draft of floating ice, as in the ISOMIP+ tasks.  This must match
# MPAS-Ocean's config_land_ice_rho_ocean.
land_ice_draft_density = 1028.0

# The thickness (m) of each active layer of the thin film where the land-ice
# load leaves too thin a column, which is where MPAS-Ocean caps the land-ice
# pressure.  This must match config_drying_min_cell_height in
# polaris.ocean.ice_shelf's wetting_drying.yaml.
thin_film_layer_thickness = 5.0e-2

# The maximum layer thickness, as a multiple of the resting thickness, that
# MPAS-Ocean's z-star coordinate allows.  With thin_film_layer_thickness as the
# minimum, this sets the initial layer thicknesses in thin columns.  This must
# match config_max_thickness_factor in the realistic_global forward runs'
# land_ice.yaml.
max_layer_thickness_factor = 6.0


# Options for the vertical grid with ice-shelf cavities
[vertical_grid]

# Columns under ice shelves drop the reference levels above the drafts along
# each shelf's calving front, so they keep layers near their reference
# thicknesses rather than squeezing the whole column under the ice
ice_shelf_top_level = front_draft
