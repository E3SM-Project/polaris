# Options for the analysis_members tasks on the EC30to60E2r2 mesh
[analysis_members]

# The baroclinic and barotropic time steps
dt = 00:30:00
btr_dt = 00:01:00

# The length of the short run.  The 1_year run is always 365 days.
short_run_duration = 0001_00:00:00

# The number of latitude bins of the 1_year run's MOC: Omega's default
moc_num_bins = 180

# The momentum viscosities apply at the mesh's median cell width of 35.9 km,
# and Omega scales them with cell width from there.  Provisional until Omega
# has the fix to its pressure-gradient errors over bathymetry.

# The harmonic momentum viscosity (m^2/s).  E3SM's 1.0e3 at 30 km
# checkerboards the divergence along the Gulf Stream and the coasts of the
# Maritime Continent in one-year runs.  1.0e4 removes that, along with the
# grid-scale noise and striped deep overturning streamfunction seen in the
# 60-km cells, at the cost of weaker resolved currents.
mom_del2 = 1.0e4

# The biharmonic momentum viscosity (m^4/s): E3SM's 1.2e11 at 30 km, rescaled
# to the median cell width
mom_del4 = 2.06e11
