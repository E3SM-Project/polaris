# Options for the rk4 variant of the realistic_global forward tasks, added
# after the per-mesh options so that it takes precedence
[realistic_global_forward]

# RK4 for both models, so that they advance the same way.  RK4 has no
# barotropic subcycling, so the run advances on rk4_dt where the mesh config
# gives one, and on btr_dt_per_km times the minimum resolution otherwise.
mpaso_time_integrator = RK4
omega_time_integrator = RK4
