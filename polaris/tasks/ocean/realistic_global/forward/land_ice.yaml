# MPAS-Ocean options for a realistic global ocean with ice-shelf cavities,
# following the ISOMIP+ tasks
mpas-ocean:
  land_ice:
    config_use_land_ice_pressure: true
  land_ice_fluxes:
    config_land_ice_flux_mode: {{ land_ice_flux_mode }}
  ALE_vertical_grid:
    # keep every layer at least as thick as wetting and drying needs, while
    # the resting thicknesses stay z-star, so thin columns have uniform
    # layers that return to z-star as the column thickens.  The minimum
    # matches config_drying_min_cell_height.
    config_use_min_max_thickness: true
    config_min_thickness: 5.0e-2
    config_max_thickness_factor: 6.0
  bottom_drag:
    # drag at the ice-ocean interface, with the ISOMIP+ top drag coefficient
    config_use_implicit_top_drag: true
    config_implicit_top_drag_coeff: 2.5e-3
