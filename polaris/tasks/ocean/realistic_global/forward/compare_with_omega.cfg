# A reference for comparing MPAS-Ocean with Omega.  Polaris never reads this
# file on its own.  Forward runs are as close to production as each model
# allows, so MPAS-Ocean runs physics that Omega does not have.  To compare the
# two models, add these options to the user config file passed to
# "polaris setup -f" (or pass this file itself), or set them in a step's
# forward.cfg before running it.
#
# The list describes what Omega lacks today and should shrink as Omega gains
# capabilities.
[realistic_global_forward]

# Omega has no Gent-McWilliams or Redi, and is not expected to gain them
use_GM = False
use_Redi = False

# Omega's submesoscale eddy parameterization is not yet in Polaris' Omega
# submodule
use_submesoscale = False

# the ordinary counterpart to Omega's Centered pressure gradient, rather than
# Jacobian_from_TS
pressure_gradient_type = pressure_and_zmid
