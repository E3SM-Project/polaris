# Options for the analysis_test task on the EC30to60E2r2 mesh
[realistic_global_analysis_test]

# The harmonic momentum viscosity (m^2/s).  Omega's default of 1.0e3 leaves
# grid-scale noise in the velocity in the 60-km mid-latitude cells, and a
# striped deep overturning streamfunction.  1.0e4 removes much of both, at the
# cost of weaker resolved currents.  Provisional until Omega has KPP and the
# fix to its pressure-gradient errors over bathymetry.
mom_del2 = 1.0e4

# The biharmonic momentum viscosity (m^4/s): Omega's default, which the
# forward runs on this mesh on unified-mesh-dev also use.  Omega does not
# scale it with cell width, and 5.0e11 is unstable with a 30-minute time step
# in the 30-km cells, so it cannot be raised enough to damp the 60-km ones.
mom_del4 = 1.2e11
