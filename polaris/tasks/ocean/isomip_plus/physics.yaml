mpas-ocean:
  time_integration:
    config_time_integrator: RK4
  advection:
    config_thickness_flux_type: upwind
    config_vert_advection_method: flux-form
  wetting_drying:
    config_use_wetting_drying: true
    config_drying_safety_height: 1.0e-10
    config_drying_min_cell_height: 1.0e-3
    config_zero_drying_velocity_ramp: false
    config_zero_drying_velocity_ramp_hmin: 1.0e-3
    config_zero_drying_velocity_ramp_hmax: 1.0e-1
    config_use_ssh_gradient_wetting_drying: false
    config_prevent_drying: true
    config_zero_drying_velocity: true
  hmix_del2:
    config_use_mom_del2: true
    config_use_tracer_del2: true
    config_mom_del2: 6.0
    config_tracer_del2: 1.0
  cvmix:
    config_cvmix_background_diffusion: 5.0e-5
    config_cvmix_background_viscosity: 1.0e-3
    config_use_cvmix_convection: true
    config_cvmix_convective_diffusion: 0.1
    config_cvmix_convective_viscosity: 0.1
    config_use_cvmix_shear: false
    config_cvmix_use_BLD_smoothing: false
  land_ice_fluxes:
    config_land_ice_flux_attenuation_coefficient: 10.0
    config_land_ice_flux_boundaryLayerThickness: 10.0
    config_land_ice_flux_explicit_topDragCoeff: 2.5e-3
    config_land_ice_flux_tidal_Jourdain_U0: 1.0e-2
    config_land_ice_flux_jenkins_heat_transfer_coefficient: 0.0194
    config_land_ice_flux_jenkins_salt_transfer_coefficient: 0.00055428571
  bottom_drag:
    config_use_implicit_top_drag: true
    config_implicit_top_drag_coeff: 2.5e-3
    config_implicit_constant_bottom_drag_coeff: 2.5e-3
  pressure_gradient:
    config_pressure_gradient_type: pressure_and_zmid
  debug:
    config_check_ssh_consistency: false
