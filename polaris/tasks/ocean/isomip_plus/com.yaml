# The COM physics of the ISOMIP+ protocol (Table 4), as Compass set it up for
# MPAS-Ocean, applied on top of physics.yaml.  Options that COM does not use
# return to MPAS-Ocean's standalone defaults.
mpas-ocean:
  eos_jm:
    config_eos_jm_pressure_from_zMid: false
  hmix_del2:
    config_use_mom_del2: true
    config_use_tracer_del2: true
    config_mom_del2: 6.0
    config_tracer_del2: 1.0
  hmix_del4:
    config_use_mom_del4: false
    config_mom_del4: 1.2e11
  cvmix:
    config_cvmix_background_diffusion: 5.0e-5
    config_cvmix_background_viscosity: 1.0e-3
    config_use_cvmix_convection: true
    config_cvmix_convective_diffusion: 0.1
    config_cvmix_convective_viscosity: 0.1
    config_use_cvmix_shear: false
    config_cvmix_shear_mixing_scheme: PP
    config_use_cvmix_kpp: false
    config_cvmix_use_BLD_smoothing: false
  submesoscale_eddy_parameterization:
    config_submesoscale_enable: false
    config_submesoscale_Ce: 0.06
  frazil_ice:
    config_use_frazil_ice_formation: false
    config_frazil_under_land_ice: false
    config_frazil_heat_of_fusion: 3.34e5
    config_specific_heat_sea_water: 3985.0
    config_frazil_use_surface_pressure: true
  land_ice_fluxes:
    config_land_ice_flux_explicit_topDragCoeff: 2.5e-3
    config_land_ice_flux_tidal_Jourdain_U0: 1.0e-2
    config_land_ice_flux_jenkins_heat_transfer_coefficient: 0.0194
    config_land_ice_flux_jenkins_salt_transfer_coefficient: 0.00055428571
  bottom_drag:
    config_implicit_top_drag_coeff: 2.5e-3
    config_implicit_constant_bottom_drag_coeff: 2.5e-3
  pressure_gradient:
    config_pressure_gradient_type: pressure_and_zmid
    config_jacobian_limit_to_water_column: false
