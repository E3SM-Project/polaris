# Options related to the vertical grid
[vertical_grid]

# Left alone for the same reason as in hydrostatic_consistency: snapping would
# move the sea floor to the nearest representable depth, which leaves the state
# exactly at rest but means the swept tilt no longer describes the geometry
# being tested. See that file for the full explanation of what this option
# does and does not do.
partial_cell_type = None


# config options for the quadratic-in-pressure hydrostatic-consistency test
[horiz_press_grad]

# This variant is hydrostatic_consistency_linear with one more node, through
# which a single quadratic passes, so that temperature and salinity are exactly
# quadratic in pseudo-height and therefore exactly quadratic in pressure.
#
# It is to the parabolic reconstruction what hydrostatic_consistency_linear is
# to the linear one: the configuration in the family where machine precision,
# up to the anchor, is the correct expectation for finite_volume_ppm.  For the
# linear reconstruction the profile is curved, so finite_volume is second order
# here, as it is on hydrostatic_consistency.

# The same column as hydrostatic_consistency.
geom_z_bot_mid = -3500.0
# m / km
geom_z_bot_grad = 0.0

z_tilde_bot_mid = -4096.0
# m / km; overridden per step by the tilt sweep
z_tilde_bot_grad = 0.0

# The single polynomial through the three nodes, rather than PCHIP, which
# through three nodes is two cubic pieces.  The layer mean of a quadratic is
# exact under the two-point Gauss rule the initial condition uses, so the
# initial condition is in the parabolic reconstruction's exact set however the
# layers are distributed.
profile_interpolation = polynomial

# The endpoints are those of hydrostatic_consistency_linear, and the middle
# node bends both profiles the way a thermocline does.  Both stay monotone over
# the whole node range: the quadratics turn only below its deepest node.  As
# there, the deepest node stays well below the reference pseudo-bottom, so the
# profile is never asked to extrapolate when a tilt makes one column's grid
# deeper than the other's.
z_tilde_mid = [0.0, -3072.0, -6144.0]
# m / km
z_tilde_grad = [0.0, 0.0, 0.0]

temperature_mid = [22.0, 8.0, 1.0]
# deg C / km
temperature_grad = [0.0, 0.0, 0.0]

salinity_mid = [35.6, 34.9, 34.66]
# g/kg / km
salinity_grad = [0.0, 0.0, 0.0]

# The same resolution pairs and tilt sweep as hydrostatic_consistency, so the
# three can be compared point for point.
horiz_resolutions = [4.0, 4.0, 4.0, 1.0]
# vertical resolution in m
vert_resolutions = [256.0, 128.0, 64.0, 256.0]

tilt_option = z_tilde_bot_grad

# m / km, spanning roughly three decades
tilt_values = [0.05, 0.1, 0.5, 1.0, 5.0, 10.0, 50.0]

tilt_fit = True

# The largest tilts are excluded from the fit, where the two columns'
# maxLevelCell values begin to differ and add a staircase component.
tilt_fit_max = 10.0

# Improvement gate. Measured offline, the smallest advantage of the linear
# finite-volume scheme anywhere in this sweep is 7.71x, at 4 km / 64 m / tilt
# 0.1: the profile is curved for the linear reconstruction, so the residual is
# its truncation and is proportional to the tilt, as on
# hydrostatic_consistency.
resting_state_improvement_min_finite_volume = 4.0

# With the parabolic reconstruction the integrand is zero at every quadrature
# point and what remains is the anchor, as for the linear reconstruction on
# hydrostatic_consistency_linear.  The smallest advantage is 27.5x, at 4 km /
# 64 m / tilt 0.1.  At a few points the linear scheme's truncation happens to
# cancel part of the anchor and it comes out ahead, so no gate compares the
# two reconstructions here.
resting_state_improvement_min_finite_volume_ppm = 15.0
