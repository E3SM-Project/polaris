Omega:
  PressureGrad:
    # HorzOrder and VerticalReconstruction are left at Omega's defaults of 2
    # and 'linear', which are the only Phase 1 values; the Phase 2 values exist
    # as keys but are rejected with an error, so a configuration written for
    # Phase 2 cannot quietly run as Phase 1.  An unrecognized PressureGradType
    # is likewise fatal rather than falling back to Centered, so a typo aborts
    # the run instead of producing centered answers that read as a pass.
    PressureGradType: {{ pressure_grad_type }}
    # the same config option that sets the Python kernel's Gauss rule, so that
    # omega_vs_polaris compares two implementations rather than two algorithms
    QuadraturePoints: {{ quadrature_points }}
  TimeIntegration:
    TimeStep: 0000_00:00:01
    StartTime: 0001-01-01_00:00:00
    StopTime: 0001-01-01_00:00:01
  Tendencies:
    ThicknessFluxTendencyEnable: false
    PVTendencyEnable: false
    KETendencyEnable: false
    SSHTendencyEnable: false
    VelDiffTendencyEnable: false
    VelHyperDiffTendencyEnable: false
    SfcStressForcingTendencyEnable: false
    BottomDragTendency:
      Enable: false
    TracerHorzAdvTendencyEnable: false
    TracerDiffTendencyEnable: false
    TracerHyperDiffTendencyEnable: false
    UseCustomTendency: false
    ManufacturedSolutionTendency: false
    PressureGradTendencyEnable: true
    VelVertMixTendencyEnable: false
    TracerVertMixTendencyEnable: false
  IOStreams:
    History:
      Filename: output.nc
      Freq: 1
      FreqUnits: Seconds
      IfExists: append
      # effectively never
      FileFreq: 9999
      FileFreqUnits: years
      Contents:
      - GeomZMid
      - GeomZInterface
      - PressureMid
      - PressureInterface
      - PseudoThickness
      - Temperature
      - Salinity
      - SpecVol
      - GeopotentialMid
      - NormalVelocityTend
      - BottomGeomDepth
      - MinLayerCell
      - MaxLayerCell
