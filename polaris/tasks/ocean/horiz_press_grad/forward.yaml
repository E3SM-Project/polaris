Omega:
  PressureGrad:
    # HorzOrder is left at Omega's default of 2, the two-cell stencil, which
    # is the only value Omega implements; others are rejected with an error.
    # An unrecognized PressureGradType or VerticalReconstruction is likewise
    # fatal rather than falling back, so a typo aborts the run instead of
    # producing answers from another scheme that read as a pass.
    PressureGradType: {{ pressure_grad_type }}
    VerticalReconstruction: {{ vertical_reconstruction }}
    # the same config option that sets the Python kernel's Gauss rule, so that
    # omega_vs_polaris compares two implementations rather than two algorithms
    QuadraturePoints: {{ quadrature_points }}
  TimeIntegration:
    TimeStep: 0000_00:00:01
    StartTime: 0001-01-01_00:00:00
    StopType: AtTime
    StopCriterion: 0001-01-01_00:00:01
  Tendencies:
    ThicknessFluxTendencyEnable: false
    PVTendencyEnable: false
    KETendencyEnable: false
    SSHTendencyEnable: false
    VelDiffTendencyEnable: false
    VelHyperDiffTendencyEnable: false
    SfcStressForcingTendencyEnable: false
    BottomDragTendency:
      Enable: false
    TracerHorzAdvTendencyEnable: false
    TracerDiffTendencyEnable: false
    TracerHyperDiffTendencyEnable: false
    UseCustomTendency: false
    ManufacturedSolutionTendency: false
    PressureGradTendencyEnable: true
    VelVertMixTendencyEnable: false
    TracerVertMixTendencyEnable: false
  IOStreams:
    History:
      Filename: output.nc
      Freq: 1
      FreqUnits: Seconds
      IfExists: append
      # effectively never
      FileFreq: 9999
      FileFreqUnits: years
      Contents:
      - GeomZMid
      - GeomZInterface
      - PressureMid
      - PressureInterface
      - PseudoThickness
      - Temperature
      - Salinity
      - SpecVol
      - GeopotentialMid
      - NormalVelocityTend
      - BottomGeomDepth
      - MinLayerCell
      - MaxLayerCell
