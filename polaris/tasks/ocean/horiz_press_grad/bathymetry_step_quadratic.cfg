# Options related to the vertical grid
[vertical_grid]

# Left alone for the same reason as in bathymetry_step: the swept parameter IS
# the sea floor, and snapping would move it to the nearest representable depth,
# at some gradients collapsing the step to nothing. See that file for the full
# explanation of what this option does and does not do.
partial_cell_type = None


# config options for the quadratic-in-pressure bathymetry-step test
[horiz_press_grad]

# This variant is bathymetry_step with hydrostatic_consistency_quadratic's
# profile: a stepped sea floor, a flat coordinate, and temperature and salinity
# exactly quadratic in pressure.
#
# It is to the parabolic reconstruction what bathymetry_step_linear is to the
# linear one: inside the exact set, and in the geometry that matters globally,
# so that what remains for finite_volume_ppm is what a bathymetry step costs
# the scheme rather than what an unresolved profile costs it.  The partial
# bottom cell it varies is also where the parabola is extrapolated below one
# column's floor.

# The same deep column as bathymetry_step and hydrostatic_consistency_quadratic.
geom_z_bot_mid = -3500.0
# m / km; overridden per step by the sweep
geom_z_bot_grad = 0.0

z_tilde_bot_mid = -4096.0
# m / km
z_tilde_bot_grad = 0.0

# The profile of hydrostatic_consistency_quadratic; see that file.
profile_interpolation = polynomial

z_tilde_mid = [0.0, -3072.0, -6144.0]
# m / km
z_tilde_grad = [0.0, 0.0, 0.0]

temperature_mid = [22.0, 8.0, 1.0]
# deg C / km
temperature_grad = [0.0, 0.0, 0.0]

salinity_mid = [35.6, 34.9, 34.66]
# g/kg / km
salinity_grad = [0.0, 0.0, 0.0]

# The same resolution pairs as bathymetry_step, so the three can be compared
# point for point.
horiz_resolutions = [4.0, 4.0]
# vertical resolution in m
vert_resolutions = [256.0, 128.0]

# the sea floor, not the coordinate
tilt_option = geom_z_bot_grad

# m / km
tilt_values = [1.0, 5.0, 10.0, 25.0, 50.0, 100.0, 200.0]

# A sea-floor step changes maxLevelCell in jumps and moves the bottom partial
# cell's thickness non-monotonically, so the residual is a staircase and a
# fitted exponent would be meaningless.
tilt_fit = False

# Improvement gate. Measured offline, the smallest advantage of the linear
# finite-volume scheme anywhere in this sweep is 15.4x, at 4 km / 256 m /
# grad 100, where the centered scheme's error happens to dip.
resting_state_improvement_min_finite_volume = 8.0

# With the parabolic reconstruction the profile is in the exact set and the
# smallest advantage is 61515x, at 4 km / 256 m / grad 200.
resting_state_improvement_min_finite_volume_ppm = 20000.0
