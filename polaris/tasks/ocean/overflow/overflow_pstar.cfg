# Overrides for the overflow task trees that use the p-star vertical
# coordinate

# Options related to the vertical grid
[vertical_grid]

# The type of vertical coordinate (e.g. z-level, z-star)
coord_type = p-star

# Pseudo-depth of the bottom of the pseudo-height grid (m).  Pseudo-depth
# is not geometric depth (dz_geom = specvol * rho_sw * dz_tilde), so the
# pseudo grid must reach deeper than the pressure at the deepest geometric
# bathymetry or the domain would be artificially truncated.  The
# pseudo-depth needed for the 2000 m geometric bottom is ~1950 m for the
# linear EOS and ~2015 m for TEOS-10; 2400 m gives a ~19% buffer over the
# worst case
bottom_depth = 2400.0

# Number of vertical levels, preserving the ~33.3 m layer spacing of the
# 60-level, 2000 m z-star grid; a multiple of 16 for Omega performance
vert_levels = 72


# Options related to the overflow case
[overflow]

# Bottom depth at bottom of overflow (m): the geometric bottom depth,
# decoupled from the deeper pseudo-depth grid above
max_bottom_depth = 2000.0

# Nominal location of the planar mesh (degrees), used to convert absolute
# salinity to practical salinity for MPAS-Ocean
nominal_lon = 0.0
nominal_lat = 0.0
