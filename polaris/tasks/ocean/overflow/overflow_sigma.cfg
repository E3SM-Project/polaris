# Overrides for the overflow task trees that use the sigma
# (terrain-following) vertical coordinate

# Options related to the vertical grid
[vertical_grid]

# The type of vertical coordinate (e.g. z-level, z-star)
coord_type = sigma

# Number of vertical levels, a multiple of 16 for Omega performance.  Every
# column uses every level, so layers are ~31 m thick over the 2000 m deep
# ocean (close to the ~33.3 m spacing of the z-star grid) and ~7.8 m on the
# 500 m shelf
vert_levels = 64
