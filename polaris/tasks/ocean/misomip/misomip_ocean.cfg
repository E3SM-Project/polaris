# config options for the ocean of the MISOMIP experiments in E3SM, which
# change those of the ISOMIP+ tasks with a thin film
[isomip_plus]

# Minimum fraction of a cell that contains land ice in order for it to be
# considered a land-ice cell by MPAS-Ocean (landIceMask == 1).  The fractions
# are what E3SM's coupler delivers from MALI, so none is removed.
min_land_ice_fraction = 0.0

# The approximate area (km^2) of the ocean, every cell of the ISOMIP+ box,
# used to estimate the number of cells in the mesh and the resources for
# model runs
approx_ocean_area = 38400.0


# config options for the standalone forward run
[isomip_plus_forward]

# Run duration in hours: one month, for comparison with the first E3SM run
run_duration = 744.0

# Output interval in hours
output_interval = 24.0
