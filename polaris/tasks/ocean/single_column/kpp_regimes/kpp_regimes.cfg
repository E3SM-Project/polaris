# wind.cfg / cooling.cfg / langmuir.cfg / sea_ice.cfg are combined with this
# file per regime in polaris/tasks/ocean/single_column/__init__.py

[vertical_grid]

# Number of vertical levels
vert_levels = 200

# Depth of the bottom of the ocean
bottom_depth = 200.0

[single_column]

# Run duration in days
run_duration = 8.

# Output interval in seconds, used only if run_duration_steps is zero
output_interval = 3600.

[ocean]

# Flux-forced energy budgets accumulate small time-integration residuals.
energy_conservation_tolerance = 1.e-6

# MPAS-Ocean shows small (~1e-14) roundoff-level salt residuals even with
# no salt forcing active (e.g. kpp_convection_cooling), just over the default
# 1e-14 tolerance.
salt_conservation_tolerance = 1.e-10
