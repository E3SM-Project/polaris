ocean:
  eos:
    config_eos_type: linear
  eos_linear:
    config_eos_linear_beta: 0.01

mpas-ocean:
  tracer_forcing_activeTracers:
    config_use_activeTracers_surface_bulk_forcing: false
    config_use_activeTracers_surface_restoring: false
    config_use_activeTracers_interior_restoring: false
  bottom_drag:
    config_implicit_constant_bottom_drag_coeff: 0.0
  cvmix:
    config_use_cvmix: false
  streams:
    output:
      type: output
      filename_template: output.nc
      output_interval: 0000_01:00:00
      clobber_mode: truncate
      contents:
      - tracers
      - xtime
      - daysSinceStartOfSim
      - zMid
      - normalVelocity
      - velocityZonal
      - velocityMeridional
      - layerThickness

Omega:
  IOStreams:
    History:
      Filename: output.nc
      Freq: 1
      FreqUnits: Hours
      IfExists: append
      # effectively never
      FileFreq: 9999
      FileFreqUnits: years
      Contents:
      - State
      - GeomZMid
      # Tracers supplies Temperature and Salinity, and Eos supplies the
      # SpecVol that layerThickness is derived from, as the baseline
      # comparison for this task requires
      - Tracers
      - Eos
