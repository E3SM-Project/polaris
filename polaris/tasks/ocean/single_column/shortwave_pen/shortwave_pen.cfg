# config options for the shortwave_pen single-column task

[single_column]

# Run duration in days (3 hours)
run_duration = 0.125

# Output interval in seconds
output_interval = 600.

[single_column_shortwave_pen]

# The Jerlov water types to run, from 1 (type I, clearest) to 5 (type III,
# most turbid).  Each type gets a forward run under either ocean model, and
# Omega additionally gets a three-band Manizza run at the same clarity.
water_types = 1, 3, 5

# Red-band extinction coefficient for the Manizza runs [1/m].  This is the
# value for the clearest water (type I); other water types scale it by the
# ratio of Jerlov visible extinction coefficients.
extinction_coeff_red = 0.35

# Blue-band extinction coefficient for the Manizza runs [1/m], scaled with
# water type in the same way as the red band so the two stay in proportion.
extinction_coeff_blue = 0.03

# Fraction of the incident shortwave flux in the near-infrared band for the
# Manizza runs.  The three band fractions must sum to one.
near_ir_fraction = 0.58

# Near-infrared extinction coefficient for the Manizza runs [1/m]
near_ir_coeff = 2.86

# Fraction of the incident shortwave flux in the red band for the Manizza runs
red_fraction = 0.23

# Fraction of the incident shortwave flux in the blue band for the Manizza runs
blue_fraction = 0.19

# The work directory of this task from a run with the other ocean model, used
# by the viz step to overlay that model's profiles on this run's.  Leave empty
# to plot only this run.
reference_output_dir =

[single_column_forcing]

# Constant incident surface shortwave heat flux applied to every forward
# run [W/m^2]. Positive values indicate a net input of heat to the ocean.
short_wave_heat_flux = 200.0
