[single_column]

# Van Roekel et al. (2018) Table 4, profile A: temperature-stratified
# column with uniform salinity, used for the CEW (cooling, evaporation,
# and wind) test.
temperature_gradient_interior = 0.01

[single_column_forcing]

# Van Roekel et al. (2018) Table 3, CEW: nonsolar cooling of -75 W/m^2
# with no shortwave contribution. cooling.cfg supplies sensible_heat_flux
# = -75.0; zero out its latent_heat_flux so the net matches Qo = -75.
latent_heat_flux = 0.0

# Van Roekel et al. (2018) Table 3, CEW: 1.37 mm/day evaporation,
# converted to a freshwater mass flux in kg m^-2 s^-1. Negative because
# evaporation is a net water loss (positive evaporation_flux means water
# added to the ocean).
evaporation_flux = -1.5856e-5
