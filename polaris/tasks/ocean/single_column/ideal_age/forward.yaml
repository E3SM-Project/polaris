mpas-ocean:
  time_management:
    config_run_duration: 0010_00:00:00
  tracer_forcing_activeTracers:
    config_use_activeTracers_surface_bulk_forcing: true
    config_use_activeTracers_surface_restoring: true
    config_use_activeTracers_interior_restoring: true
  tracer_forcing_idealAgeTracers:
    config_use_idealAgeTracers: true
    config_use_idealAgeTracers_idealAge_forcing: true
  streams:
    output:
      type: output
      filename_template: output.nc
      output_interval: 0001_00:00:00
      clobber_mode: truncate
      contents:
      - tracers
      - xtime
      - daysSinceStartOfSim
      - zMid
      - normalVelocity
      - velocityZonal
      - velocityMeridional
      - layerThickness
      - idealAgeTracers
