[single_column_forcing]

# Net destabilizing (surface cooling) heat flux for free-convection KPP
# tests. Unlike evap.cfg, the net heat flux here is negative (heat loss),
# driving convective mixed-layer deepening rather than restratification.
latent_heat_flux = -150.0

sensible_heat_flux = -75.0

short_wave_heat_flux = 0.0
