[single_column]

# Van Roekel et al. (2018) Table 4, profile C approximation. The
# single-column initializer represents the 25 m mixed layer and the
# thermocline/halocline below it, but not the table's finite-width halocline.
mixed_layer_depth_temperature = 25.0
temperature_gradient_mixed_layer = 0.0
temperature_gradient_interior = 0.01
mixed_layer_depth_salinity = 25.0
salinity_gradient_mixed_layer = 0.0
salinity_gradient_interior = -0.03
