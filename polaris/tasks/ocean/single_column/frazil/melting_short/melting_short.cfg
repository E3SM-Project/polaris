# Options related to the vertical grid
[vertical_grid]

# Number of vertical levels
vert_levels = 2

# Depth of the bottom of the ocean, giving two 1 m layers
bottom_depth = 2.0


# config options for single-column frazil test cases
[single_column_frazil]

# Uniform salinity through the water column [PSU]
dsdz = 0.0

# Temperature of the layer(s) above the transition depth [degC], overridden
# by each variant
temperature_top_melting_short = 2.0

# Amount by which the layer(s) below the transition depth are initialized
# below the local EOS freezing point [degC], overridden by each variant
supercooling_melting_short = 0.5

# Depth separating the warm layer above from the supercooled layer below [m]
transition_depth_melting_short = 1.0


# config options for forcing single-column frazil test cases
[single_column_forcing]

# No surface forcing is applied in this task, overriding the latent heat flux
# inherited from frazil.cfg
latent_heat_flux = 0.0
