# config options for the melt0.1h variant of the melting_short task, with a
# thin melting (top) layer over a 10x thicker supercooled (bottom) layer
[vertical_grid]

# tanh_dz sets the top layer to exactly min_layer_thickness and, for two
# levels, the bottom layer to exactly bottom_depth - min_layer_thickness
grid_type = tanh_dz

# Number of vertical levels
vert_levels = 2

# Depth of the bottom of the ocean, giving a 1 m top and a 10 m bottom layer
bottom_depth = 11.0

# Target thickness of the top layer [m]
min_layer_thickness = 1.0

# Only shapes the tanh solve; it does not set the bottom layer thickness [m]
max_layer_thickness = 20.0


[single_column_frazil]

# Temperature of the layer(s) above the transition depth [degC]
temperature_top_melting_short = 5.0

# Amount by which the layer(s) below the transition depth are initialized
# below the local EOS freezing point [degC]
supercooling_melting_short = 1.5
