# config options for the warm variant of the melting_short task
[single_column_frazil]

# Temperature of the layer(s) above the transition depth [degC]
temperature_top_melting_short = 2.0

# Amount by which the layer(s) below the transition depth are initialized
# below the local EOS freezing point [degC]
supercooling_melting_short = 0.5
