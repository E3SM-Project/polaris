[single_column]

# Van Roekel et al. (2018) Table 4, profile A: temperature-stratified
# column with uniform salinity, used for the FC (free convection) test.
temperature_gradient_interior = 0.01

[single_column_forcing]

# Van Roekel et al. (2018) Table 3, FC: nonsolar cooling of -75 W/m^2
# with no shortwave contribution. cooling.cfg supplies sensible_heat_flux
# = -75.0; zero out its latent_heat_flux so the net matches Qo = -75.
latent_heat_flux = 0.0
