# Options for plotting the mesh and bathymetry in regional insets
[mesh_review]

# The initial state, with bottomDepth and, unless mesh_filename is given, the
# mesh.  Paths should be absolute.  Tasks that produce these files, such as
# realistic global initialization, set them directly.
init_filename = <<<missing>>>

# The MPAS mesh, if it isn't in the initial state
mesh_filename =

# The vertical coordinate, needed if the initial state has no bottomDepth (as
# for Omega)
vert_coord_filename =

# Bottom depths (m) bounding the filled color bands
levels = 0, 10, 20, 30, 40, 50, 100, 250, 500, 750, 1000, 1500, 2000, 3000,
    4000, 5000

# Colormap for the filled bottom depth
cmap = cmo.deep

# Bottom depths (m) of the isobaths drawn on both panels
contours = 21.99, 50, 500
