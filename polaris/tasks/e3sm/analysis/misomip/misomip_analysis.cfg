# options for analyzing the MISOMIP experiments run in E3SM and the
# standalone MPAS-Ocean runs on the same inputs
[misomip_analysis]

# The first and last year analyzed, inclusive.  Each run contributes every
# monthly mean it has in this range; a month missing between the first and
# last found is an error.
start_year = 1
end_year = 100

# The number of months at the end of a run that maps and sections average
# over: for Ocean0, as the protocol's tuning does, and for the rest
mean_months_ocean0 = 6
mean_months = 12

# The draft (m) below which the deep mean melt rate is taken, the protocol's
# tuning target
deep_draft = -300.0

# The height (m) of the bins of draft over which melt is averaged
draft_bin_width = 20.0

# The spacing (m) of the lines of constant x across which the overturning
# streamfunction is computed, and the height (m) of its bins
overturning_dx = 2000.0
overturning_dz = 5.0

# Where a run writes both the inputs of the overturning streamfunction from
# the volume budget and the layer thickness flux, the largest difference
# between the two, as a share of the overturning's strength, beyond which
# the diagnostics step warns
overturning_method_tolerance = 0.01

# Whether to write the protocol's ocean fields on its 2 km by 5 m output
# grid (Asay-Davis et al. 2016, Sect. 3.3) for each run.  The analysis
# itself works on the models' meshes and does not need them.
write_protocol_fields = False

# The y (m) of the section along x, and the x (m) of the section along y, in
# the protocol's coordinates
section_y = 40000.0
section_x = 520000.0

# The x (m) in the protocol's coordinates from which temperature and
# salinity are restored.  The open ocean's sea-surface height is compared
# with this region's.
restoring_x = 790000.0

# The thickness (m) of the slab above the seafloor whose mean flow gives the
# geostrophic height of the gyres at the seafloor, which is compared with
# the residual of the open ocean's sea-surface height
bottom_slab_thickness = 100.0

# Where to publish the plots, organized by mesh and experiment.  Defaults to
# <work_dir>/analysis_output.  Point this somewhere web-servable to share the
# results.
output_path =

# A short name for the analysis, used in the gallery's title
simulation_name = misomip

# Whether to copy the netCDF file of each plot's data into output_path too
copy_netcdf = False

# The size, scale, format and quality of thumbnails in the gallery
thumbnail_size = 320, 240
thumbnail_scale = 2.0
thumbnail_format = jpeg
thumbnail_quality = 75


# The color ranges of maps and sections, as "minimum, maximum" in the plots'
# units.  A range set here is the same in every run, experiment and
# resolution, so their plots can be compared, as in Asay-Davis et al.
# (2016).  A blank range comes from each plot's own data, leaving out the
# thin film under grounded ice.  The bottom temperature and salinity use the
# temperature and salinity ranges, and both components of the boundary
# layer's velocity use one range.  An option with "_bounds" gives the edges
# of uneven color bins instead, with "_ticks" the color bar's ticks.
[misomip_analysis_color_ranges]
temperature = -2.5, 1.0
salinity =
# salinity in coarse bins up to 33.5 PSU, which show the fresh film under
# grounded ice, and 0.1 PSU bins above, which resolve the cavity and the
# open ocean
salinity_bounds = 0.0, 5.0, 10.0, 20.0, 30.0, 33.0, 33.5, 33.8, 34.0, 34.1,
                  34.2, 34.3, 34.4, 34.5, 34.6, 34.7, 34.8
salinity_ticks = 0.0, 10.0, 30.0, 33.5, 34.0, 34.2, 34.4, 34.6, 34.8
ice_draft = -720.0, 0.0
bathymetry = -720.0, 0.0
melt_rate =
thermal_driving =
haline_driving =
friction_velocity =
boundary_layer_velocity =
barotropic_streamfunction =
overturning_streamfunction =
ssh =


