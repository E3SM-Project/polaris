# E3SM's names for the grids of a pair of MISOMIP meshes.  Each pair's config
# file sets them.
[misomip_grids]

# the ocean grid
ocean_grid =

# MALI's grid
landice_grid =

# the model grid that pairs them
model_grid =


# options for the graph partitions of the ocean's mesh
[misomip_ocean_partitions]

# The approximate maximum number of cells per core, which sets the fewest
# cores a partition is made for
max_cells_per_core = 2000

# The approximate minimum number of cells per core, which sets the most cores
# a partition is made for
min_cells_per_core = 40

# The number of graph partitions to build at once, if a node has that many
# cores
partition_cpus_per_task = 128

# The fewest cores the graph-partition step can run with
partition_min_cpus_per_task = 1


# options for the graph partitions of MALI's mesh
[misomip_landice_partitions]

# The approximate maximum number of cells per core, which sets the fewest
# cores a partition is made for
max_cells_per_core = 30000

# The approximate minimum number of cells per core, which sets the most cores
# a partition is made for
min_cells_per_core = 100

# The number of graph partitions to build at once, if a node has that many
# cores
partition_cpus_per_task = 128

# The fewest cores the graph-partition step can run with
partition_min_cpus_per_task = 1
