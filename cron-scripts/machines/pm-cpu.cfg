# Nightly cron settings for pm-cpu

[cron]

# the tasks to run each night, in order
tasks = omega_cdash, polaris_cdash

# how many days of logs to keep
keep_logs_days = 30

# the login nodes have no cron; the nightly runs as a Slurm scrontab job in
# the cron QOS: one core, 4 GiB, 24 hours
scheduler = scrontab

# the account for the scrontab job
account = e3sm

# Omega's build reaches the cron QOS's 4 GiB, even at make -j 2, so
# build in a job on a compute node instead.  The job asks for the debug QOS,
# whose queue wait is a few minutes.
build_in_job = true

# the compilers to test.  They must be ones
# docs/developers_guide/supported_machines.yaml lists for Omega on this
# machine.  Omega picks the architecture (OMEGA_ARCH) from the compiler,
# as it does for every other Polaris build.
compilers = gnu
