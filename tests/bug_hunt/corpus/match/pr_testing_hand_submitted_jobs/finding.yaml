claim: In the Omega PR-testing utility, coupled tests that the tester submits
  by hand (setup without --submit) are never matched to their job IDs, so if
  one dies before it starts running, for example at its wall time or on a
  failed node, omega_pr_test.py report says it has not finished on every run
  instead of reporting the failure
