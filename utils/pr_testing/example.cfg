# Settings for the PR testing utilities, such as utils/omega/pr_testing.
# Copy this file to ~/.config/polaris_pr_test.cfg (or pass another path with
# -f) on your own computer and on each machine, and fill it in.  Environment
# variables and ~ are expanded.
[polaris_pr_test]

# where Omega worktrees, baselines and test runs go (on scratch, on a
# machine).  Keep it the same from day to day, with no date in it, so that
# baselines and worktrees are reused.
work_base = /path/to/scratch/polaris_pr_test

# a clone of E3SM-Project/Omega, or of your fork, to make worktrees from, on
# the same filesystem as work_base (on scratch, on a machine).  Git keeps each
# worktree's submodule clones in this clone, not in the worktree, so a clone
# in your home directory fills its quota.
omega_repo = /path/to/a/clone/of/Omega

# your E3SM fork, which test branches for Omega PRs are pushed to (the
# initiator only)
fork = git@github.com:<your GitHub user>/E3SM.git

# your Polaris fork, with the branches to test with when an Omega PR needs
# Polaris changes (the initiator only, and only then)
polaris_fork = git@github.com:<your GitHub user>/polaris.git

# a conda environment made from Omega's components/omega/dev-conda.txt,
# used only if Omega's CI has not passed on an Omega PR (the initiator only)
omega_dev_env = /path/to/conda/envs/omega_dev

# other places to look for a baseline to reuse, besides work_base (testers
# only)
baseline_search_roots =

# a Polaris checkout that tracks main, deployed with a load script for each
# of this machine's compilers, that baselines from main run from (testers
# only)
polaris_main = /path/to/polaris/main


# On your own computer only: the machines an agent there tests over ssh,
# each as <ssh host>:<Polaris checkout on the machine>, for example
# "chrysalis = chrys:/home/me/polaris".  The host is an alias in your
# ~/.ssh/config with ControlMaster set, so that the agent uses the
# connection you open by logging in.  The path is expanded on the machine.
# The pm-cpu line serves pm-gpu too.  Leave out Frontier, which does not
# allow shared connections.
[machines]
# aurora = <host>:/path/to/polaris
# chrysalis = <host>:/path/to/polaris
# pm-cpu = <host>:/path/to/polaris
