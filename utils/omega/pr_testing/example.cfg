# Settings for the Omega PR testing utility on one machine.  Copy this file
# to ~/.config/omega_pr_test.cfg (or pass another path with -f) and fill it
# in.  Environment variables and ~ are expanded.
[omega_pr_test]

# where Omega worktrees, baselines and test runs go (on scratch).  Keep it
# the same from day to day, with no date in it, so that baselines and
# worktrees are reused.
work_base = /path/to/scratch/omega_pr_test

# a clone of E3SM-Project/Omega, or of your fork, to make worktrees from
omega_repo = /path/to/a/clone/of/Omega

# your fork, which test branches are pushed to (the initiator only)
fork = git@github.com:<your GitHub user>/E3SM.git

# your Polaris fork, with the branches to test with when a PR needs Polaris
# changes (the initiator only, and only then)
polaris_fork = git@github.com:<your GitHub user>/polaris.git

# a conda environment made from Omega's components/omega/dev-conda.txt,
# used only if Omega's CI has not passed on the PR (the initiator only)
omega_dev_env = /path/to/conda/envs/omega_dev

# other places to look for a baseline to reuse, besides work_base
baseline_search_roots =
